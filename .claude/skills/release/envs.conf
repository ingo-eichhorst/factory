# The environments this repo keeps running, one per line:
#
#   <name> <port> <policy>
#
# policy `main-only` means a release is refused unless the commit is reachable
# from `origin/main` -- the branch everything lands on through a pull request.
# `any` takes any ref, and any worktree path, which is the point of staging.
#
# These two are the standing environments: `ensure.sh` brings back whichever of
# them is not running. Anything else is ad-hoc -- name it on the command line
# and it gets a derived port, a fresh instance and no entry here. Nothing else
# reads this file, so a new standing environment is one line plus a release.

production 8790 main-only
staging    8791 any
