[workspace]
resolver = "3"
members = [
    "crates/factory-adapter",
    "crates/factory-cli",
    "crates/factory-config",
    "crates/factory-context",
    "crates/factory-daemon",
    "crates/factory-delegation",
    "crates/factory-doctor",
    "crates/factory-e2e",
    "crates/factory-paths",
    "crates/factory-recovery",
    "crates/factory-registry",
    "crates/factory-session",
    "crates/factory-store",
    "crates/factory-task",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

# Dependencies are declared here and inherited by member crates. Crate authors
# do not run `cargo add`: the manifest and lockfile are owned centrally so that
# parallel work on separate crates never collides in the same file.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.2"
thiserror = "2"
uuid = "1"
tempfile = "3"

# Station 10's two new outside dependencies.
#
# `clap` parses design §7's command surface. The derive feature keeps the
# surface declared next to the types it produces, so a command cannot exist in
# the parser without a struct that carries its arguments.
#
# `fd-lock` holds ADR 0014's installation lock — the exclusive lock ADR 0012
# deferred until something long-lived existed to hold it. It wraps `flock` in a
# safe API, which this workspace requires: `unsafe_code` is forbidden, so
# calling `libc::flock` here is not an option.
clap = { version = "4", features = ["derive"] }
fd-lock = "4"

# `bundled` compiles SQLite into the binary rather than linking whatever macOS
# ships, so `VACUUM INTO` and the locking behaviour cannot change under Factory
# when the host is upgraded. ADR 0012 decision 1.
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
