[package]
name = "factory-assurance"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.factory]
level = 5

[dependencies]
factory-kernel = { path = "../factory-kernel" }
factory-process = { path = "../factory-process" }
serde.workspace = true
chrono.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
serde_json.workspace = true
sha2.workspace = true
csv.workspace = true
async-trait.workspace = true
rusqlite.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
# Not a factory-* crate, so the level-dependency ladder does not apply to it
# -- used only to open a scope-declared metrics source with O_NOFOLLOW
# (`reported.rs`), the same way factory-environment already opens sandbox
# evidence.
libc = "0.2"

[dev-dependencies]
uuid.workspace = true
tokio = { workspace = true, features = ["test-util"] }
