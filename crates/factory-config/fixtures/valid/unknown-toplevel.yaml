# A synthetic regression fixture, not a literal copy of any live file: it
# proves ADR 0009 rule 2 survives ADR 0015's document-shape change. An
# unrelated top-level `runtime:` block (nested maps and a list, of the kind
# `ensure_assistant_agents.py` owns in a scope's own file) must still be
# ignored, not rejected, when it sits alongside `version`/`instance`/`scopes`
# in the instance's own file. The scope entry itself carries only
# Factory-owned fields -- ADR 0015 makes a scope entry `deny_unknown_fields`,
# so a block like this can no longer live *inside* an entry the way it used
# to live at a scope file's top level.
version: 1

instance:
  id: c835520e-5940-4c0d-8cb2-93b02ce4efe2
  name: business-factory-fixture

scopes:
  - id: 57a4ca60-28a4-486b-a073-99de5782e32e
    name: assistant-fixture
    path: assistant
    agents:
      - name: assistant
        harness: pi
        max_sessions: 1
        lifetime: permanent
      - name: assistant-chat
        harness: pi
        max_sessions: 1
        lifetime: permanent

runtime:
  version: 1
  herdr:
    binary: ${HOME}/.local/bin/herdr
    session: factory
    workspace_label: assistant
  agents:
    - name: assistant
      kind: pi
      lifetime: permanent
      cwd: ${REPO_ROOT}/assistant
    - name: assistant-chat
      kind: pi
      lifetime: permanent
      cwd: ${REPO_ROOT}/assistant/chat
