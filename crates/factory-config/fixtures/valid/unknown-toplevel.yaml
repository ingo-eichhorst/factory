# A realistic shape of the live `assistant` scope config (see
# /Users/factory/business-factory/assistant/.factory/config.yaml), with the
# scope ID and every embedded session ID replaced by freshly generated values
# so this fixture can never be mistaken for a live scope. Proves ADR 0009
# rule 2: the `runtime:` block — nested maps and a list, owned by
# `ensure_assistant_agents.py` — must survive untouched.
version: 1

scope:
  id: fb58a4a1-c7ac-4f53-9f1f-fd770eee4268
  name: assistant-fixture

agent:
  name: Assistant
  harness: pi
  max_sessions: 2

runtime:
  version: 1
  herdr:
    binary: ${HOME}/.local/bin/herdr
    session: factory
    workspace_label: assistant
    workspace_cwd: ${REPO_ROOT}/assistant
    agent_start_timeout_ms: 30000
  agents:
    - name: assistant
      kind: pi
      lifetime: permanent
      cwd: ${REPO_ROOT}/assistant
      split_direction: right
      pi_args:
        - --session-id
        - 8f6e6f2b-9b0b-4b2a-9b0a-1c2d3e4f5a6b
        - --name
        - assistant
        - --no-extensions
        - --no-skills
        - --extension
        - ${HOME}/.pi/agent/extensions/herdr-agent-state.ts
        - --extension
        - ${REPO_ROOT}/.pi/extensions/factory-tasks.ts
        - --extension
        - ${REPO_ROOT}/assistant/.pi/extensions/local-llamacpp.ts
        - --provider
        - business-factory-qwen3.8
        - --model
        - qwen3.8-27b
        - --thinking
        - medium
        - --approve
    - name: assistant-chat
      kind: pi
      lifetime: permanent
      cwd: ${REPO_ROOT}/assistant/chat
      split_direction: right
      pi_args:
        - --session-id
        - 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
        - --name
        - assistant-chat
        - --no-builtin-tools
        - --no-extensions
        - --no-skills
        - --provider
        - business-factory-qwen3.8-chat
        - --model
        - qwen3.8-27b
        - --thinking
        - low
        - --approve
