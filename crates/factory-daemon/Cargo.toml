[package]
name = "factory-daemon"
description = "The Factory supervisor and its local socket API (design §3, ADR 0014, ADR 0002): the only process that mutates core state, and the client half its CLI speaks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
factory-adapter = { path = "../factory-adapter" }
factory-config = { path = "../factory-config" }
factory-context = { path = "../factory-context" }
factory-delegation = { path = "../factory-delegation" }
# Station 12's two durable writing paths (ADR 0022 decision 1): the daemon
# is the process that stages a note or a memory entry and commits the
# `durable_writes` row around it, so the note-graph logic is a dependency of
# this crate rather than of the CLI.
factory-knowledge = { path = "../factory-knowledge" }
factory-paths = { path = "../factory-paths" }
factory-recovery = { path = "../factory-recovery" }
factory-registry = { path = "../factory-registry" }
factory-session = { path = "../factory-session" }
factory-store = { path = "../factory-store" }
factory-task = { path = "../factory-task" }
# The dispatcher stamps `schedules.last_fired_at` and renders
# `tasks.fired_for_minute`, both of which are `chrono` values produced by
# `factory_task::schedule`. Cron parsing itself is not here: ADR 0021 decision
# 3a puts the one home of "does this expression match this minute" in
# `factory_task::schedule`, and this crate calls it.
chrono.workspace = true
fd-lock.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `tests/cost.rs` opens a second, real connection to a fixture's SQLite file
# to force write contention (proving a failed cost write cannot roll back a
# completion that already committed) and to read committed session state at
# an exact moment (proving cost is sampled before session teardown). Neither
# is expressible against `factory_store::Store` alone.
rusqlite.workspace = true

[lints]
workspace = true
