[package]
name = "factory-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "factory-daemon"
path = "src/main.rs"

[dependencies]
factory-core = { path = "../factory-core" }
factory-plugins = { path = "../factory-plugins" }
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
clap.workspace = true
croner.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
rusqlite.workspace = true
# Host facts for L1 Infrastructure: sysctlbyname, statvfs, getloadavg.
libc = "0.2"
# L1 Backup (#116): the snapshot archive and its manifest's checksums.
tar = "0.4"
zstd = "0.13"
sha2.workspace = true
# L1 Backup v2 (#152): encrypting a snapshot to a single native X25519
# recipient. Default features only -- no ssh, plugin, armor or cli-common.
age = "0.12"
