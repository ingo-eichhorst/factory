<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Leitstand</title>
<style>
*{box-sizing:border-box}html{color-scheme:light dark}body{margin:0}
img{max-width:100%}[hidden]{display:none!important}
</style>
<style>
:root{
  --canvas:#E4E8EA; --panel:#F7F9FA; --panel-2:#EDF1F3; --sunk:#DCE3E6;
  --ink:#101619; --ink-2:#3B4A52; --muted:#66787F; --faint:#8A9AA1;
  --line:#C2CDD3; --line-soft:#D8E0E4;
  --signal:#12557E; --signal-wash:rgba(18,85,126,.10);
  --run:#1B7A55; --idle:#6B7A82; --wait:#9C6806; --fault:#9E3A2B;
  --run-wash:rgba(27,122,85,.12); --wait-wash:rgba(156,104,6,.13); --fault-wash:rgba(158,58,43,.11);
  --idle-wash:rgba(107,122,130,.12);
  --ly1:#47585F; --ly2:#2E7A86; --ly3:#2F79B5; --ly4:#6B4FA3; --ly5:#A8438A; --ly6:#B4841C;
  --sans:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --cond:"Avenir Next Condensed","Helvetica Neue",system-ui,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0F1417; --panel:#161D21; --panel-2:#131A1D; --sunk:#0B1013;
  --ink:#E2EAED; --ink-2:#AFBFC6; --muted:#8598A0; --faint:#63757C;
  --line:#2A353A; --line-soft:#222C31;
  --signal:#5AA6D8; --signal-wash:rgba(90,166,216,.14);
  --run:#3FA97C; --idle:#7B8C94; --wait:#C79420; --fault:#CF6653;
  --run-wash:rgba(63,169,124,.15); --wait-wash:rgba(199,148,32,.15); --fault-wash:rgba(207,102,83,.14);
  --idle-wash:rgba(123,140,148,.14);
  --ly1:#7D929A; --ly2:#4FAEBB; --ly3:#5CA5DE; --ly4:#9C81D1; --ly5:#D370B4; --ly6:#D9AC44;
}}
:root[data-theme="dark"]{
  --canvas:#0F1417; --panel:#161D21; --panel-2:#131A1D; --sunk:#0B1013;
  --ink:#E2EAED; --ink-2:#AFBFC6; --muted:#8598A0; --faint:#63757C;
  --line:#2A353A; --line-soft:#222C31;
  --signal:#5AA6D8; --signal-wash:rgba(90,166,216,.14);
  --run:#3FA97C; --idle:#7B8C94; --wait:#C79420; --fault:#CF6653;
  --run-wash:rgba(63,169,124,.15); --wait-wash:rgba(199,148,32,.15); --fault-wash:rgba(207,102,83,.14);
  --idle-wash:rgba(123,140,148,.14);
  --ly1:#7D929A; --ly2:#4FAEBB; --ly3:#5CA5DE; --ly4:#9C81D1; --ly5:#D370B4; --ly6:#D9AC44;
}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font:400 13px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--cond);text-wrap:balance}
p{margin:0}

/* ---------- shell ---------- */
#shell{display:flex;flex-direction:column;min-height:100vh}
.mast{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding:11px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.mast .nm{font:700 15px/1 var(--cond);letter-spacing:.02em}
.mast .sub{font:400 11.5px var(--sans);color:var(--muted)}
.mast .wire-counts{margin-left:auto;font:500 11px var(--mono);color:var(--faint);display:flex;gap:12px}
.mast .wire-counts b{color:var(--ink-2);font-weight:600}
.body{display:grid;grid-template-columns:236px minmax(0,1fr);flex:1;min-height:0}
.levels{border-right:1px solid var(--line);background:var(--panel-2);padding:8px 0 14px}
.main{padding:18px 22px 30px;min-width:0}
.wire{border-top:1px solid var(--line);background:var(--panel);padding:7px 20px;
  display:flex;gap:18px;flex-wrap:wrap;align-items:center;
  font:400 11px var(--mono);color:var(--muted)}
.wire .k{color:var(--faint)}
.wire .dot{width:6px;height:6px;border-radius:50%;background:var(--run);display:inline-block;margin-right:5px}

/* ---------- level column ---------- */
.lvtitle{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);padding:6px 14px 8px}
.lv{display:grid;grid-template-columns:3px 24px minmax(0,1fr) auto;align-items:center;gap:9px;
  width:100%;padding:0 12px 0 0;border:0;background:none;text-align:left;cursor:pointer;
  height:46px;border-bottom:1px solid var(--line-soft)}
.lv:first-of-type{border-top:1px solid var(--line-soft)}
.lv .rail{height:100%;background:var(--c)}
.lv .n{font:600 11px var(--mono);color:var(--c);padding-left:3px}
.lv .t{font:600 13px/1.2 var(--cond);letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv .t small{display:block;font:400 10.5px var(--sans);color:var(--muted);letter-spacing:0}
.lv .c{font:500 11px var(--mono);color:var(--ink-2)}
.lv:hover{background:var(--panel)}
.lv[aria-current="true"]{background:var(--panel);box-shadow:inset -2px 0 0 var(--c)}
.lv.off .t{color:var(--faint)} .lv.off .rail{opacity:.35} .lv.off .n{opacity:.6}
.lv.off .c{color:var(--faint)}
.lv:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}

/* ---------- view head ---------- */
.vhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.vhead h2{font-size:19px;font-weight:700;letter-spacing:.01em}
.vhead .lvtag{font:600 10.5px var(--mono);color:var(--c);border:1px solid var(--c);
  border-radius:2px;padding:1px 5px;align-self:center}
.vhead .lede{flex:1 1 340px;min-width:0;font-size:12.5px;color:var(--muted);max-width:66ch}

/* ---------- panels ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:13px 15px}
.card > h3{font:700 12.5px var(--cond);letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-2);margin-bottom:9px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.q{font:500 10px var(--mono);color:var(--faint);border:1px solid var(--line-soft);
  border-radius:2px;padding:1px 5px;letter-spacing:0;text-transform:none;font-weight:500;white-space:nowrap}
.q.w{color:var(--signal);border-color:var(--signal);opacity:.85}
.grid{display:grid;gap:13px}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1080px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.note b,.note strong{color:var(--ink-2);font-weight:600}
.note code,code.i{font:500 11.5px var(--mono);color:var(--signal);background:var(--signal-wash);
  padding:1px 4px;border-radius:2px}
.sep{height:1px;background:var(--line-soft);margin:11px 0}

/* ---------- pills ---------- */
.pill{font:600 10.5px var(--mono);border-radius:2px;padding:1px 6px;white-space:nowrap;
  border:1px solid currentColor}
.pill.run{color:var(--run);background:var(--run-wash)}
.pill.wait{color:var(--wait);background:var(--wait-wash)}
.pill.fault{color:var(--fault);background:var(--fault-wash)}
.pill.idle{color:var(--idle);background:var(--idle-wash)}
.pill.sig{color:var(--signal);background:var(--signal-wash)}
.pill.ghost{color:var(--faint);background:transparent;border-style:dashed}

/* ---------- actions ---------- */
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.act{display:inline-flex;align-items:baseline;gap:7px;border:1px solid var(--line);
  background:var(--panel-2);border-radius:3px;padding:5px 9px;cursor:pointer;
  font:500 12px var(--sans)}
.act code{font:500 10.5px var(--mono);color:var(--signal)}
.act:hover:not([disabled]){border-color:var(--signal);background:var(--signal-wash)}
.act[disabled]{opacity:.5;cursor:not-allowed}
.act[disabled] code{color:var(--muted)}
.act:focus-visible{outline:2px solid var(--signal);outline-offset:1px}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;min-width:520px;font-size:12px}
table.t th{font:600 10px var(--mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);text-align:left;padding:0 10px 6px 0;border-bottom:1px solid var(--line)}
table.t td{padding:6px 10px 6px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.m,table.t td .m{font:400 11.5px var(--mono);color:var(--ink-2)}
table.t td.num{font-variant-numeric:tabular-nums;text-align:right;padding-right:14px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
#alarm{padding:9px 20px;background:var(--fault-wash);border-bottom:1px solid var(--fault);
  color:var(--fault);font:500 12.5px/1.5 var(--sans)}
#alarm code{color:inherit;background:rgba(0,0,0,.06);border-radius:2px;padding:1px 4px;
  font:500 11.5px var(--mono)}
.dot.bad{background:var(--fault)} .dot.warm{background:var(--wait)}
.empty{padding:26px 22px;text-align:center;border:1px dashed var(--line);border-radius:3px;
  color:var(--muted);font-size:12.5px}
.empty b{display:block;font:600 14px var(--cond);color:var(--ink);margin-bottom:5px}

/* ---------- command dialog ---------- */
dialog#dlg{border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);
  padding:0;max-width:min(680px,93vw);width:100%;box-shadow:0 18px 48px rgba(0,0,0,.22)}
dialog#dlg::backdrop{background:rgba(16,22,25,.45)}
.dwrap{padding:15px 17px;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow-y:auto}
.dhead{display:flex;align-items:center;gap:10px}
.dhead h3{font:700 15px var(--cond);letter-spacing:.02em}
.dx{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--muted);
  font-size:13px;padding:2px 6px;border-radius:3px;line-height:1}
.dx:hover{background:var(--sunk);color:var(--ink)}
.dlede{font-size:12.5px;line-height:1.6;color:var(--muted);max-width:62ch;margin:0}
.dlede code{font:500 11.5px var(--mono);color:var(--signal)}
.dfields{display:flex;flex-direction:column;gap:11px}
.fr{display:flex;flex-direction:column;gap:4px}
.fl{font:600 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.fl .opt{font-weight:400;text-transform:none;letter-spacing:0}
.fi{font:400 12.5px var(--sans);color:var(--ink);background:var(--panel-2);
  border:1px solid var(--line);border-radius:3px;padding:6px 8px;width:100%;display:block}
textarea.fi{font:400 12.5px/1.55 var(--sans);resize:vertical}
.fi:focus-visible{outline:2px solid var(--signal);outline-offset:-1px;border-color:var(--signal)}
.fi.ro{font:400 11.5px var(--mono);color:var(--muted);background:transparent}
.fi.empty-sel{color:var(--wait);border-style:dashed}
.fh{font:400 11px/1.5 var(--sans);color:var(--faint);margin:0}
.fh code{font:500 10.5px var(--mono);color:var(--signal)}
.fradio{display:flex;gap:15px;flex-wrap:wrap;font-size:12.5px}
.fradio label,.fcheck{display:flex;align-items:center;gap:6px;cursor:pointer}
.fcheck{font-size:12.5px}
.dprev{border:1px solid var(--line-soft);border-radius:3px;background:var(--sunk)}
.dprev .pt{font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);padding:6px 9px 0}
.dprev .pt code{color:var(--signal);text-transform:none;letter-spacing:0}
.dprev pre{margin:0;padding:5px 9px 9px;font:400 11px/1.5 var(--mono);color:var(--ink-2);
  overflow-x:auto;max-height:200px}
.derr{border:1px solid var(--fault);border-left-width:2px;border-radius:3px;
  background:var(--fault-wash);padding:8px 10px}
.derr b{font:600 11px var(--mono);color:var(--fault)}
.derr p{margin:3px 0 0;font-size:12px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap}
.dres{border:1px solid var(--run);border-left-width:2px;border-radius:3px;
  background:var(--run-wash);padding:8px 10px}
.dres .rt{font:600 11px var(--mono);color:var(--run)}
.dres table.t{margin-top:6px;min-width:0}
.argv{margin:6px 0 0;padding:8px 10px;background:var(--ink);color:var(--panel);border-radius:3px;
  font:400 11.5px/1.55 var(--mono);overflow-x:auto;white-space:pre-wrap;word-break:break-all}
.dacts{display:flex;gap:8px;justify-content:flex-end}
.act.go{background:var(--signal);border-color:var(--signal);color:#fff;font-weight:600}
.act.go:hover:not([disabled]){filter:brightness(1.12)}
.act.go.danger{background:var(--fault);border-color:var(--fault)}
</style>
<style>
/* ---------- scope tree ---------- */
.tree{margin:0;padding:0;list-style:none;font-size:12.5px}
.tree ul{list-style:none;margin:0 0 0 9px;padding-left:9px;border-left:1px solid var(--line-soft)}
.srow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;
  padding:5px 8px;border-radius:3px;cursor:pointer}
.srow:hover{background:var(--panel-2)}
.srow[aria-current="true"]{background:var(--signal-wash);box-shadow:inset 2px 0 0 var(--signal)}
.srow .nm{font:600 12.5px var(--sans)}
.srow .pth{font:400 11px var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .ag{margin-left:auto;font:500 10.5px var(--mono);color:var(--muted);white-space:nowrap}
.srow.drift .ag{color:var(--wait)}
.srow:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}

/* ---------- agents & sessions ---------- */
.arow{display:grid;grid-template-columns:minmax(120px,1.3fr) minmax(90px,1fr) auto auto;
  gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.arow:last-child{border-bottom:0}
.arow .an{font:600 12.5px var(--sans)}
.arow .an small{display:block;font:400 10.5px var(--mono);color:var(--faint)}
.arow .hx{font:400 11.5px var(--mono);color:var(--ink-2)}
.arow .hx .mdl{display:block;font:400 10.5px var(--mono);color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess{border:1px solid var(--line-soft);border-radius:3px;padding:9px 11px;background:var(--panel-2)}
.sess + .sess{margin-top:8px}
.sess .sh{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sess .sid{font:600 12px var(--mono)}
.sess .ws{font:400 11px var(--mono);color:var(--muted);margin-top:4px;word-break:break-all}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:repeat(6,minmax(178px,1fr));gap:11px;
  overflow-x:auto;padding-bottom:4px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:9px;min-width:0}
.col > h4{margin:0 0 8px;font:700 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;
  display:flex;justify-content:space-between;align-items:center;gap:6px}
.col.c-queued > h4{color:var(--muted)} .col.c-running > h4{color:var(--run)}
.col.c-blocked > h4{color:var(--wait)} .col.c-done > h4{color:var(--ink-2)}
.col.c-failed > h4{color:var(--fault)} .col.c-cancelled > h4{color:var(--faint)}
.col > h4 span{font-weight:500;color:var(--faint)}
.tk{display:block;width:100%;text-align:left;border:1px solid var(--line-soft);background:var(--panel-2);
  border-radius:3px;padding:8px 9px;cursor:pointer;margin-bottom:7px}
.tk:last-child{margin-bottom:0}
.tk:hover{border-color:var(--signal)}
.tk[aria-current="true"]{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal)}
.tk .ti{display:flex;align-items:center;gap:6px;font:600 11px var(--mono);color:var(--muted)}
.tk .ti .src{margin-left:auto;font-weight:500;color:var(--faint)}
.tk .tp{font:400 12px/1.4 var(--sans);color:var(--ink);margin:4px 0 6px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tk .tm{display:flex;gap:8px;flex-wrap:wrap;font:400 10.5px var(--mono);color:var(--faint)}
.tk .tm b{font-weight:500;color:var(--muted)}
.col.empty-hint{opacity:.75}
.col .none{font:400 11px var(--sans);color:var(--faint);padding:3px 1px}
.tk:focus-visible{outline:2px solid var(--signal);outline-offset:1px}

/* ---------- task detail ---------- */
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:12px;margin:0}
.dl dt{font:500 10.5px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.06em;
  padding-top:2px;white-space:nowrap}
.dl dd{margin:0;font:400 11.5px var(--mono);color:var(--ink-2);word-break:break-word}
.dl dd.s{font:400 12px var(--sans);color:var(--ink)}
.prompt{font:400 12.5px/1.55 var(--sans);background:var(--panel-2);border:1px solid var(--line-soft);
  border-left:2px solid var(--ly4);border-radius:0 3px 3px 0;padding:9px 11px;margin:0 0 11px}
.blank{border:1px dashed var(--line);border-radius:3px;padding:11px 13px;background:transparent}
.blank .bt{font:600 12px var(--cond);letter-spacing:.03em;text-transform:uppercase;color:var(--wait);
  display:flex;align-items:center;gap:8px;margin-bottom:6px}

/* ---------- missing / build plan ---------- */
.miss{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 13px;align-items:start;font-size:12.5px}
.miss .qn{font:600 11.5px var(--mono);color:var(--wait);white-space:nowrap;padding-top:1px}
.miss .qd{color:var(--muted)} .miss .qd b{color:var(--ink-2);font-weight:600}
.evts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.evts i{font:500 11px var(--mono);font-style:normal;border:1px solid var(--line);border-radius:2px;
  padding:2px 6px;color:var(--ink-2);background:var(--panel-2)}
.evts i.na{color:var(--faint);border-style:dashed;background:transparent}
.big{font:700 27px/1 var(--cond);font-variant-numeric:tabular-nums;color:var(--ink)}
.big + .bl{font:400 11px var(--sans);color:var(--muted);margin-top:3px}
.stack{display:flex;flex-direction:column;gap:13px}
@media (max-width:860px){
  .body{grid-template-columns:minmax(0,1fr)}
  .levels{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:0}
  .lv{height:auto;padding:8px 12px 8px 0;border-bottom:0;border-right:1px solid var(--line-soft);
     grid-template-columns:3px 22px auto;flex:0 0 auto}
  .lv .c{display:none} .lv .t small{display:none}
  .main{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="shell">
  <div class="mast">
    <span class="nm">Factory Leitstand</span>
    <span class="sub">Was die Fabrik heute beantworten kann — und was noch nicht.</span>
    <span class="wire-counts">
      <span><b>13</b> Queries</span><span><b>20</b> Kommandos</span><span><b>0</b> Abos</span>
    </span>
  </div>
  <div id="alarm" hidden></div>
  <div class="body">
    <nav class="levels" id="levels" aria-label="Entscheidungsebenen"></nav>
    <main class="main" id="main"></main>
  </div>
  <div class="wire">
    <span><span class="dot" id="dot"></span><b id="live">verbinde …</b></span>
    <span><span class="k">socket</span> <b id="sock">—</b></span>
    <span><span class="k">letzter aufruf</span> <b id="lastcall">—</b></span>
    <span><span class="k">aufrufe</span> <b id="ncalls">—</b> je Durchgang</span>
    <span><span class="k">aktualisierung</span> alle 5 s — kein Abo auf dem Draht</span>
  </div>
</div>
<dialog id="dlg" aria-label="Kommando"></dialog>
<script>
(function(){
'use strict';

/* ------------------------------------------------------------------ *
 * The data layer. Every value this page shows comes back from one of
 * the daemon's own queries, through the one endpoint the HTTP
 * transport exposes — the same ADR 0003 envelope the Unix socket
 * takes. Nothing here is stored, derived from a second source, or
 * carried over from a previous poll.
 * ------------------------------------------------------------------ */

var ZERO='00000000-0000-0000-0000-000000000000';
var POLL_MS=5000;

var S={scopes:[],agents:{},targetable:{},refusal:{},sessions:[],leases:[],tasks:[],
       schedules:[],daemon:null,root:ZERO,calls:0,loaded:false};
var cur='harn', selScope=null, selTask=null, timer=null, inflight=false;

function $(s){return document.querySelector(s)}
function uuid(){
  if(window.crypto&&window.crypto.randomUUID)return window.crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g,function(){
    return (Math.random()*16|0).toString(16);
  });
}

/* One request. A refusal from the daemon is thrown with its code attached, so
   a caller can tell `not_found.scope` from a transport failure. */
function send(kind,name,payload,scopeId){
  var body={request_id:uuid(),scope_id:scopeId||ZERO,payload:payload||{}};
  body.api=(kind==='q')?'factory.query/v1':'factory.command/v1';
  if(kind==='q')body.query=name; else body.command=name;
  S.calls++;
  return fetch('/api',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  }).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(j){
    if(j.api==='factory.error/v1'){
      var e=new Error(j.error.message); e.code=j.error.code; throw e;
    }
    return j.result;
  });
}
function q(name,payload,scopeId){return send('q',name,payload,scopeId)}

function load(){
  var calls0=S.calls, agents={}, targ={}, refus={}, sessions=[], leases=[];
  return q('daemon.status').then(function(d){
    S.daemon=d;
    return q('scope.list');
  }).then(function(r){
    S.scopes=r.scopes||[];
    var root=S.scopes.filter(function(s){return !s.parent_id})[0];
    S.root=root?root.id:ZERO;
    if(!S.scopes.length)return {scopes:[]};
    // `agent.list` is the one operation that reads the caller's scope from the
    // payload rather than the envelope: targetability is relative to whoever
    // is asking. The page asks as the root scope, and says so on L3.
    return q('agent.list',{scope_id:S.root},S.root);
  }).then(function(r){
    (r.scopes||[]).forEach(function(e){
      agents[e.scope_id]=e.agents||[];
      targ[e.scope_id]=e.targetable;
      if(e.refusal_reason)refus[e.scope_id]=e.refusal_reason;
    });
    S.agents=agents; S.targetable=targ; S.refusal=refus;
    // One call per scope: `agent.status` filters on the envelope's scope and
    // there is no factory-wide session query. See the note on L3.
    return S.scopes.reduce(function(chain,sc){
      return chain.then(function(){
        return q('agent.status',{},sc.id).then(function(r2){
          (r2.sessions||[]).forEach(function(x){sessions.push(x)});
        });
      });
    },Promise.resolve());
  }).then(function(){
    S.sessions=sessions;
    // And one more per session: leases come back only when a single
    // `session_id` is named, and the row itself does not carry it — the
    // pairing below is the page's, not the store's.
    return sessions.reduce(function(chain,se){
      return chain.then(function(){
        return q('agent.status',{session_id:se.id},se.scope_id).then(function(r3){
          (r3.leases||[]).forEach(function(l){l.session=se.id; leases.push(l)});
        });
      });
    },Promise.resolve());
  }).then(function(){
    S.leases=leases;
    return q('task.list');
  }).then(function(r){
    S.tasks=r.tasks||[];
    return q('schedule.list');
  }).then(function(r){
    S.schedules=r.schedules||[];
    S.loaded=true;
    // Keep the selection only while it still exists: a task can finish and a
    // scope can be removed between two polls.
    if(!S.scopes.some(function(x){return x.id===selScope}))
      selScope=S.scopes.length?S.root:null;
    if(!S.tasks.some(function(t){return t.id===selTask}))
      selTask=S.tasks.length?S.tasks[0].id:null;
    return S.calls-calls0;
  });
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function ago(iso){
  if(!iso)return '—';
  var t=Date.parse(iso.length<=19&&iso.indexOf('Z')<0?iso+'Z':iso);
  if(isNaN(t))return '—';
  var m=Math.round((Date.now()-t)/60000);
  if(m<0)return 'in '+(-m)+' min';
  if(m<1)return 'gerade eben';
  if(m<60)return m+' min';
  var h=Math.floor(m/60);
  if(h<24)return h+' h'+(m%60?' '+(m%60)+' min':'');
  return Math.floor(h/24)+' d'+(h%24?' '+(h%24)+' h':'');
}
function stamp(iso){return iso?esc(String(iso).replace('T',' ').replace(/\.\d+Z?$/,'').replace(/Z$/,'')):'—'}
function kn(n){return n==null?'—':(n>=1000?(Math.round(n/100)/10).toFixed(1).replace('.',',')+'k':String(n))}
function dur(ms){
  if(ms==null)return '—';
  var m=Math.round(ms/60000);
  return m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min';
}

function viewProc(){
  var lede='Die Liste kommt in einem Aufruf und trägt alles, was eine Karte braucht — Status, Auslöser, Vorlage, '+
   'Sitzung, Zeiten und sogar die Token. Die sechs Spalten sind nicht gewählt, sondern die sechs Werte, die '+
   '<code>tasks.status</code> per CHECK zulässt.';

  var board=STATUSES.map(function(st){
    var list=S.tasks.filter(function(t){return t.status===st.k});
    return '<div class="col c-'+st.k+'"><h4>'+esc(st.t)+' <span>'+list.length+'</span></h4>'+
      (list.length?list.map(function(t){
        var sc=scopeById(t.target_scope_id);
        return '<button class="tk" data-task="'+esc(t.id)+'"'+(t.id===selTask?' aria-current="true"':'')+'>'+
          '<span class="ti">'+esc(shortId(t.id))+'<span class="src">'+
          esc(t.triggered_by==='cron'?'cron':'manuell')+'</span></span>'+
          '<span class="tp">'+esc(t.prompt)+'</span>'+
          '<span class="tm"><b>'+esc(sc?sc.name:shortId(t.target_scope_id))+'</b>'+
          (t.template_id?'<span>'+esc(t.template_id)+(t.template_version!=null?'@v'+esc(t.template_version):'')+
            '</span>':'')+
          '<span>'+ago(t.updated_at)+'</span></span></button>';
      }).join(''):'<p class="none">—</p>')+'</div>';
  }).join('');

  var detail;
  var t=selTask?taskById(selTask):null;
  if(!t){
    detail=empty(S.tasks.length?'Keine Task ausgewählt':'Noch kein Auftrag',
      S.tasks.length?'<p>Wähle oben eine Karte.</p>':
      '<p>Diese Instanz hat noch nichts zu tun bekommen. <code class="i">task.send</code> ist das Kommando, '+
      'das den ersten Auftrag anlegt.</p>');
  }else{
    var sc=scopeById(t.target_scope_id), se=t.assigned_session_id?sessById(t.assigned_session_id):null;
    var rows='';
    function row(l,v){rows+='<dt>'+esc(l)+'</dt><dd>'+v+'</dd>'}
    row('id',esc(t.id));
    row('status','<span class="pill '+(TASK_CLS[t.status]||'idle')+'">'+esc(t.status)+'</span>');
    row('scope',esc(sc?sc.name:'—')+' <span class="faint">'+esc(shortId(t.target_scope_id))+'</span>');
    row('session',t.assigned_session_id?
      esc(shortId(t.assigned_session_id))+(se?' <span class="faint">'+esc(se.agent_name)+' · '+
      esc(se.state)+'</span>':''):'<span class="faint">nicht zugeteilt</span>');
    row('triggered_by',esc(t.triggered_by||'—')+(t.schedule_id?' <span class="faint">'+
      esc(shortId(t.schedule_id))+(t.fired_for_minute?' · '+esc(t.fired_for_minute):'')+'</span>':''));
    row('template',t.template_id?esc(t.template_id)+(t.template_version!=null?'@v'+esc(t.template_version):''):
      '<span class="faint">—</span>');
    row('created',stamp(t.created_at)+' <span class="faint">vor '+ago(t.created_at)+'</span>');
    row('updated',stamp(t.updated_at)+' <span class="faint">vor '+ago(t.updated_at)+'</span>');
    if(t.cost_model||t.cost_input_tokens!=null)
      row('kosten',kn(t.cost_input_tokens)+' in / '+kn(t.cost_output_tokens)+' out'+
        (t.cost_model?' · '+esc(t.cost_model):'')+' · '+dur(t.cost_duration_ms)+
        (t.context_utilization_percent!=null?' · Kontext '+esc(t.context_utilization_percent)+' %':''));
    if(t.reworks_task_id)row('nacharbeit an',esc(shortId(t.reworks_task_id))+
      (t.rework_finding?'<div class="s" style="margin-top:3px">'+esc(t.rework_finding)+'</div>':''));
    if(t.blocked_reason)row('blocked_reason','<span class="s">'+esc(t.blocked_reason)+'</span>');
    if(t.result_summary)row('result','<span class="s">'+esc(t.result_summary)+'</span>');
    if(t.result_artifact_paths&&t.result_artifact_paths.length)
      row('artefakte',t.result_artifact_paths.map(function(p){return esc(tilde(p))}).join('<br>'));

    // Every action carries the run it acts on. `rework` is the exception:
    // its `task_id` is the *new* run's, minted in the dialog, and the old
    // one travels as `reworks_task_id`.
    var on={scope_id:t.target_scope_id,payload:{task_id:t.id}};
    var rw={scope_id:t.target_scope_id,payload:{reworks_task_id:t.id}};
    var A=function(label,cmd,ctx){return act(label,cmd,false,null,ctx)};
    var actions=[];
    if(t.status==='queued')actions.push(A('Zuteilen','task.assign',on),A('Abbrechen','task.cancel',on));
    if(t.status==='running')actions.push(A('Abbrechen','task.cancel',on),
      A('Blockieren','task.block',on),A('Notiz anhängen','task.progress',on));
    if(t.status==='blocked')actions.push(A('Fortsetzen','task.resume',on),
      A('Abbrechen','task.cancel',on));
    if(t.status==='done')actions.push(A('Abnehmen','task.verify',on),A('Nacharbeit','task.rework',rw));
    if(t.status==='failed')actions.push(A('Abnehmen','task.verify',on),
      A('Nacharbeit','task.rework',rw));
    if(t.status==='cancelled')actions.push(act('Nacharbeit','task.rework',true,

/* ------------------------------------------------------------------ *
 * The acting half.
 *
 * Every button opens one dialog, and the dialog shows the exact envelope
 * it is about to POST — built from the same object that is sent, never a
 * display copy, so the two cannot drift. Nothing is validated here: the
 * daemon's error corpus already says precisely what is wrong with a
 * payload, and a second copy of those rules in this file is the copy
 * that would go stale.
 * ------------------------------------------------------------------ */

/* A UUIDv7, because `ids.rs` mints v7 and `create::list` orders by
   `created_at, id`: a v4 id sorts arbitrarily inside a timestamp tie, and
   nothing on the daemon side checks the version. `crypto.randomUUID()` is
   v4, so it is deliberately not used. */
function newId(){
  var b=new Uint8Array(16), i;
  if(window.crypto&&window.crypto.getRandomValues)window.crypto.getRandomValues(b);
  else for(i=0;i<16;i++)b[i]=Math.random()*256|0;
  var ms=Date.now();
  b[0]=Math.floor(ms/0x10000000000)&0xff;
  b[1]=Math.floor(ms/0x100000000)&0xff;
  b[2]=Math.floor(ms/0x1000000)&0xff;
  b[3]=Math.floor(ms/0x10000)&0xff;
  b[4]=Math.floor(ms/0x100)&0xff;
  b[5]=ms&0xff;
  b[6]=(b[6]&0x0f)|0x70;   /* version 7 */
  b[8]=(b[8]&0x3f)|0x80;   /* RFC 9562 variant */
  var h='';
  for(i=0;i<16;i++)h+=(b[i]<0x10?'0':'')+b[i].toString(16);
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}

     help:'Ein IANA-Name. Ein Offset überlebt keine Zeitumstellung.'},
    {k:'__form',t:'radio',label:'Vorlage',value:'new',options:[
      {v:'new',l:'neue Vorlage anlegen'},{v:'existing',l:'bestehende Vorlage'}]},
    {k:'template_name',t:'text',label:'Name der Vorlage',when:{__form:'existing'},req:true},
    {k:'template_id',t:'readonly',label:'template_id',when:{__form:'new'},mint:true},
    {k:'name',t:'text',label:'Name',when:{__form:'new'},req:true},
    {k:'task',t:'area',rows:4,label:'Auftragstext',when:{__form:'new'},req:true},
    {k:'agent_name',t:'select',label:'Agent',when:{__form:'new'},opt:true,
     options:[{v:'',l:'— keiner —'}].concat(agentOptions(ctx.scope_id||S.root))},
    {k:'acceptance_criteria',t:'area',rows:3,label:'Abnahmekriterien',when:{__form:'new'},opt:true}
  ]}}
};

/* ---------- the dialog ---------- */
var DLG=null;

function openCmd(cmd,ctx){
  var spec=CMD[cmd];
  if(!spec)return;
  DLG={spec:spec,cmd:cmd,ctx:ctx||{},vals:{},ids:{},req:newId(),busy:false,err:null,result:null};
  if(spec.mint)DLG.ids[spec.mint]=newId();
  spec.fields(DLG.ctx).forEach(function(f){
    if(f.mint){DLG.ids[f.k]=newId(); return}
    DLG.vals[f.k]=(f.value!=null)?f.value:
      (f.t==='bool'?false:
      (f.t==='select'&&f.options&&f.options.length?f.options[0].v:''));
  });
  paintDialog();
  var d=$('#dlg');
  if(!d.open)d.showModal();
  var first=d.querySelector('[data-f]:not([disabled])');
  if(first)first.focus();
}

/* Only the fields whose `when` matches the current choice. A field that is
   not shown is not sent — that is how the two "exactly one of" forms
   (`task.send`'s agent vs session, `schedule.create`'s new vs existing
   template) stay unambiguous without this file knowing the rule. */
function activeFields(){
  return DLG.spec.fields(DLG.ctx).filter(function(f){
    if(!f.when)return true;
    var key=Object.keys(f.when)[0];
    return DLG.vals[key]===f.when[key];
  });
}

/* The one envelope. What the preview renders and what `submit` posts are
   this same object — there is deliberately no second, prettier copy. */
function envelopeOf(){
  var spec=DLG.spec, e={};
  e.api=(spec.k==='q')?'factory.query/v1':'factory.command/v1';
  e.request_id=DLG.req;
  e.scope_id=DLG.vals.__scope||DLG.ctx.scope_id||S.root;
  if(spec.k==='q')e.query=DLG.cmd; else e.command=DLG.cmd;

  var p={};
  var given=DLG.ctx.payload||{};
  Object.keys(given).forEach(function(k){p[k]=given[k]});
  if(spec.mint)p[spec.mint]=DLG.ids[spec.mint];
  activeFields().forEach(function(f){
    if(f.k.slice(0,2)==='__')return;
    if(f.mint){p[f.k]=DLG.ids[f.k]; return}
    var v=DLG.vals[f.k];
    if(f.t==='bool'){p[f.k]=!!v; return}
    // An empty required field is sent as an empty string rather than
    // omitted, so the daemon answers with its own message about *that*
    // field instead of a generic "missing".
    if(v===''||v==null){ if(f.req)p[f.k]=''; return }
    p[f.k]=v;
  });
  e.payload=p;
  return e;
}

function fieldHtml(f){
  var v=DLG.vals[f.k], id='f_'+f.k;
  var lab='<label class="fl" for="'+id+'">'+esc(f.label)+
    (f.opt?' <span class="opt">optional</span>':'')+'</label>';
  var ctl;
  if(f.mint){
    ctl='<output class="fi ro" id="'+id+'">'+esc(DLG.ids[f.k])+'</output>';
  }else if(f.t==='area'){
    ctl='<textarea class="fi" id="'+id+'" data-f="'+esc(f.k)+'" rows="'+(f.rows||3)+'">'+
      esc(v)+'</textarea>';
  }else if(f.t==='select'){
    var opts=(f.options||[]);
    ctl=opts.length?
      '<select class="fi" id="'+id+'" data-f="'+esc(f.k)+'">'+opts.map(function(o){
        return '<option value="'+esc(o.v)+'"'+(String(o.v)===String(v)?' selected':'')+'>'+
          esc(o.l)+'</option>';
      }).join('')+'</select>':
      '<output class="fi ro empty-sel">nichts zur Auswahl</output>';
  }else if(f.t==='radio'){
    ctl='<div class="fradio">'+(f.options||[]).map(function(o){
      return '<label><input type="radio" name="'+id+'" data-f="'+esc(f.k)+'" value="'+esc(o.v)+'"'+
        (String(o.v)===String(v)?' checked':'')+'> '+esc(o.l)+'</label>';
    }).join('')+'</div>';
  }else if(f.t==='bool'){
    ctl='<label class="fcheck"><input type="checkbox" data-f="'+esc(f.k)+'"'+(v?' checked':'')+
      '> '+esc(f.label)+'</label>';
    lab='';
  }else{
    ctl='<input class="fi" type="text" id="'+id+'" data-f="'+esc(f.k)+'" value="'+esc(v)+'">';
  }
  return '<div class="fr">'+lab+ctl+
    (f.help?'<p class="fh">'+f.help+'</p>':'')+'</div>';
}

function resultHtml(){
  if(!DLG.result)return '';
  var r=DLG.result;
  if(DLG.cmd==='agent.attach_command'){
    var argv=(r.argv||[]).map(function(a){
      return /[\s"'$]/.test(a)?"'"+String(a).replace(/'/g,"'\\''")+"'":a;
    }).join(' ');
    return '<div class="dres"><div class="rt">Im Terminal ausführen</div>'+
      '<pre class="argv">'+esc(argv)+'</pre>'+
      '<p class="fh">Der Leitstand hängt sich nicht selbst an: eine Sitzung gehört in ein Terminal, '+
      'nicht in einen Browser-Tab.</p></div>';
  }
  if(DLG.cmd==='scope.reconcile'){
    var drift=r.drift||[], applied=r.applied||[];
    var rows=function(list){
      return list.map(function(d){
        return '<tr><td class="m">'+esc(d.name||shortId(d.id))+'</td><td class="m">'+
          esc(d.kind)+'</td></tr>';
      }).join('');
    };
    return '<div class="dres"><div class="rt">'+
      (r.clean?'Keine Abweichung':drift.length+' Abweichung'+(drift.length===1?'':'en'))+'</div>'+
      (drift.length?'<table class="t"><thead><tr><th>Scope</th><th>Art</th></tr></thead><tbody>'+
        rows(drift)+'</tbody></table>':'')+
      (applied.length?'<p class="fh"><b>'+applied.length+' behoben.</b></p>':
        (drift.length?'<p class="fh">Nur berichtet — nichts geändert.</p>':''))+
    '</div>';
  }
  return '<div class="dres"><div class="rt">Angenommen</div><pre class="argv">'+
    esc(JSON.stringify(r,null,2))+'</pre></div>';
}

function paintDialog(){
  var spec=DLG.spec;
  var fields=activeFields().map(fieldHtml).join('');
  var env=envelopeOf();
  var err=DLG.err?'<div class="derr"><b>'+esc(DLG.err.code)+'</b>'+
    '<p>'+esc(DLG.err.message)+'</p></div>':'';
  $('#dlg').innerHTML=
   '<form method="dialog" class="dwrap">'+
    '<div class="dhead"><h3>'+esc(spec.title)+'</h3><span class="q w">'+esc(DLG.cmd)+'</span>'+
      '<button class="dx" value="cancel" aria-label="Schließen">✕</button></div>'+
    '<p class="dlede">'+spec.lede+'</p>'+
    (fields?'<div class="dfields">'+fields+'</div>':'')+
    err+resultHtml()+
    '<div class="dprev"><div class="pt">Das geht an <code>POST /api</code></div>'+
      '<pre>'+esc(JSON.stringify(env,null,2))+'</pre></div>'+
    '<div class="dacts">'+
      '<button class="act" value="cancel">'+(DLG.result?'Schließen':'Abbrechen')+'</button>'+
      (DLG.result&&spec.keep?'':
        '<button class="act go'+(spec.danger?' danger':'')+'" id="dgo" type="button"'+
        (DLG.busy?' disabled':'')+'>'+(DLG.busy?'sendet …':'Senden')+'</button>')+
    '</div>'+
   '</form>';
}

function submit(){
  if(DLG.busy)return;
  DLG.busy=true; DLG.err=null; paintDialog();
  var env=envelopeOf();
  fetch('/api',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(env)
  }).then(function(r){return r.json()}).then(function(j){
    DLG.busy=false;
    if(j.api==='factory.error/v1'){DLG.err=j.error; paintDialog(); return}
    DLG.result=j.result;
    $('#lastcall').textContent='→ '+DLG.cmd;
    if(DLG.spec.keep)paintDialog(); else $('#dlg').close();
    poll();
  }).catch(function(e){
    DLG.busy=false;
    DLG.err={code:'transport',message:e.message};
    paintDialog();
  });
}

document.addEventListener('input',function(e){
  var el=e.target.closest('[data-f]');
  if(!el||!DLG||!$('#dlg').open)return;
  DLG.vals[el.getAttribute('data-f')]=(el.type==='checkbox')?el.checked:el.value;
  // Repaint only the preview while typing; repainting the fields would move
  // the caret. A radio or checkbox changes which fields apply, so it gets
  // the full repaint through the `change` listener below.
  var prev=$('#dlg .dprev pre');
  if(prev)prev.textContent=JSON.stringify(envelopeOf(),null,2);
});
document.addEventListener('change',function(e){
  var el=e.target.closest('[data-f]');
  if(!el||!DLG||!$('#dlg').open)return;
  if(el.type!=='radio'&&el.type!=='checkbox'&&el.tagName!=='SELECT')return;
  DLG.vals[el.getAttribute('data-f')]=(el.type==='checkbox')?el.checked:el.value;
  paintDialog();
});
document.addEventListener('click',function(e){
  if(e.target&&e.target.id==='dgo')submit();
});

/* ---------- router ---------- */
var VIEWS={harn:viewHarn,proc:viewProc,env:viewEnv,infra:viewInfra,imp:viewImp,dir:viewDir};
var CALL={harn:'scope.list + agent.list + agent.status',proc:'task.list',env:'agent.status',
  infra:'daemon.status + schedule.list',imp:'—',dir:'—'};

function render(){
  renderLevels();
  $('#main').innerHTML=VIEWS[cur]();
  $('#lastcall').textContent=CALL[cur];
}

function poll(){
  if(inflight)return;
  inflight=true;
  load().then(function(n){
    inflight=false;
    alarm(null);
    wire(n,true);
    render();
  }).catch(function(e){
    inflight=false;
    wire(null,false);
    alarm('<b>Der Daemon antwortet nicht:</b> '+esc(e.message)+
      (e.code?' <code>'+esc(e.code)+'</code>':'')+
      ' — die Seite zeigt weiter den letzten Stand. Läuft <code>factory start</code>?');
    if(S.loaded)render();
  });
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-go],[data-scope],[data-task],[data-cmd]');
  if(!b)return;
  if(b.hasAttribute('data-cmd')){
    if(b.disabled)return;
    var raw=b.getAttribute('data-ctx');
    var ctx={};
    if(raw){try{ctx=JSON.parse(raw)}catch(err){ctx={}}}
    openCmd(b.getAttribute('data-cmd'),ctx);
    return;
  }
  if(b.hasAttribute('data-go')){
    cur=b.getAttribute('data-go');
    // The level is in the address bar, so a view can be bookmarked and a
    // reload comes back where it was.
    if(window.location.hash!=='#'+cur)window.location.hash=cur;
    render(); window.scrollTo(0,0); return;
  }
  if(b.hasAttribute('data-scope')){selScope=b.getAttribute('data-scope'); render(); return}
  if(b.hasAttribute('data-task')){selTask=b.getAttribute('data-task'); render(); return}
});

function fromHash(){
  var h=String(window.location.hash||'').replace(/^#/,'');
  if(VIEWS[h])cur=h;
}
window.addEventListener('hashchange',function(){fromHash(); render(); });

fromHash();
renderLevels();
$('#main').innerHTML='<div class="empty"><b>Verbinde mit dem Daemon …</b></div>';
poll();
timer=window.setInterval(poll,POLL_MS);
})();
</script>
