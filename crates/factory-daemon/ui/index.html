<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Leitstand</title>
<style>
*{box-sizing:border-box}html{color-scheme:light dark}body{margin:0}
img{max-width:100%}[hidden]{display:none!important}
</style>
<style>
:root{
  --canvas:#E4E8EA; --panel:#F7F9FA; --panel-2:#EDF1F3; --sunk:#DCE3E6;
  --ink:#101619; --ink-2:#3B4A52; --muted:#66787F; --faint:#8A9AA1;
  --line:#C2CDD3; --line-soft:#D8E0E4;
  --signal:#12557E; --signal-wash:rgba(18,85,126,.10);
  --run:#1B7A55; --idle:#6B7A82; --wait:#9C6806; --fault:#9E3A2B;
  --run-wash:rgba(27,122,85,.12); --wait-wash:rgba(156,104,6,.13); --fault-wash:rgba(158,58,43,.11);
  --idle-wash:rgba(107,122,130,.12);
  --ly1:#47585F; --ly2:#2E7A86; --ly3:#2F79B5; --ly4:#6B4FA3; --ly5:#A8438A; --ly6:#B4841C;
  --sans:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --cond:"Avenir Next Condensed","Helvetica Neue",system-ui,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0F1417; --panel:#161D21; --panel-2:#131A1D; --sunk:#0B1013;
  --ink:#E2EAED; --ink-2:#AFBFC6; --muted:#8598A0; --faint:#63757C;
  --line:#2A353A; --line-soft:#222C31;
  --signal:#5AA6D8; --signal-wash:rgba(90,166,216,.14);
  --run:#3FA97C; --idle:#7B8C94; --wait:#C79420; --fault:#CF6653;
  --run-wash:rgba(63,169,124,.15); --wait-wash:rgba(199,148,32,.15); --fault-wash:rgba(207,102,83,.14);
  --idle-wash:rgba(123,140,148,.14);
  --ly1:#7D929A; --ly2:#4FAEBB; --ly3:#5CA5DE; --ly4:#9C81D1; --ly5:#D370B4; --ly6:#D9AC44;
}}
:root[data-theme="dark"]{
  --canvas:#0F1417; --panel:#161D21; --panel-2:#131A1D; --sunk:#0B1013;
  --ink:#E2EAED; --ink-2:#AFBFC6; --muted:#8598A0; --faint:#63757C;
  --line:#2A353A; --line-soft:#222C31;
  --signal:#5AA6D8; --signal-wash:rgba(90,166,216,.14);
  --run:#3FA97C; --idle:#7B8C94; --wait:#C79420; --fault:#CF6653;
  --run-wash:rgba(63,169,124,.15); --wait-wash:rgba(199,148,32,.15); --fault-wash:rgba(207,102,83,.14);
  --idle-wash:rgba(123,140,148,.14);
  --ly1:#7D929A; --ly2:#4FAEBB; --ly3:#5CA5DE; --ly4:#9C81D1; --ly5:#D370B4; --ly6:#D9AC44;
}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font:400 13px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--cond);text-wrap:balance}
p{margin:0}

/* ---------- shell ---------- */
#shell{display:flex;flex-direction:column;min-height:100vh}
.mast{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding:11px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.mast .nm{font:700 15px/1 var(--cond);letter-spacing:.02em}
.mast .sub{font:400 11.5px var(--sans);color:var(--muted)}
.mast .wire-counts{margin-left:auto;font:500 11px var(--mono);color:var(--faint);display:flex;gap:12px}
.mast .wire-counts b{color:var(--ink-2);font-weight:600}
.body{display:grid;grid-template-columns:236px minmax(0,1fr);flex:1;min-height:0}
.levels{border-right:1px solid var(--line);background:var(--panel-2);padding:8px 0 14px}
.main{padding:18px 22px 30px;min-width:0}
.wire{border-top:1px solid var(--line);background:var(--panel);padding:7px 20px;
  display:flex;gap:18px;flex-wrap:wrap;align-items:center;
  font:400 11px var(--mono);color:var(--muted)}
.wire .k{color:var(--faint)}
.wire .dot{width:6px;height:6px;border-radius:50%;background:var(--run);display:inline-block;margin-right:5px}

/* ---------- panels ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:13px 15px}
.card > h3{font:700 12.5px var(--cond);letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-2);margin-bottom:9px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.q{font:500 10px var(--mono);color:var(--faint);border:1px solid var(--line-soft);
  border-radius:2px;padding:1px 5px;letter-spacing:0;text-transform:none;font-weight:500;white-space:nowrap}
.q.w{color:var(--signal);border-color:var(--signal);opacity:.85}
.grid{display:grid;gap:13px}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1080px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.note b,.note strong{color:var(--ink-2);font-weight:600}
.note code,code.i{font:500 11.5px var(--mono);color:var(--signal);background:var(--signal-wash);
  padding:1px 4px;border-radius:2px}
.sep{height:1px;background:var(--line-soft);margin:11px 0}

/* ---------- pills ---------- */
.pill{font:600 10.5px var(--mono);border-radius:2px;padding:1px 6px;white-space:nowrap;
  border:1px solid currentColor}
.pill.run{color:var(--run);background:var(--run-wash)}
.pill.wait{color:var(--wait);background:var(--wait-wash)}
.pill.fault{color:var(--fault);background:var(--fault-wash)}
.pill.idle{color:var(--idle);background:var(--idle-wash)}
.pill.sig{color:var(--signal);background:var(--signal-wash)}
.pill.ghost{color:var(--faint);background:transparent;border-style:dashed}

/* ---------- actions ---------- */
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.act{display:inline-flex;align-items:baseline;gap:7px;border:1px solid var(--line);
  background:var(--panel-2);border-radius:3px;padding:5px 9px;cursor:pointer;
  font:500 12px var(--sans)}
.act code{font:500 10.5px var(--mono);color:var(--signal)}
.act:hover:not([disabled]){border-color:var(--signal);background:var(--signal-wash)}
.act[disabled]{opacity:.5;cursor:not-allowed}
.act[disabled] code{color:var(--muted)}
.act:focus-visible{outline:2px solid var(--signal);outline-offset:1px}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;min-width:520px;font-size:12px}
table.t th{font:600 10px var(--mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);text-align:left;padding:0 10px 6px 0;border-bottom:1px solid var(--line)}
table.t td{padding:6px 10px 6px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.m,table.t td .m{font:400 11.5px var(--mono);color:var(--ink-2)}
table.t td.num{font-variant-numeric:tabular-nums;text-align:right;padding-right:14px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
#alarm{padding:9px 20px;background:var(--fault-wash);border-bottom:1px solid var(--fault);
  color:var(--fault);font:500 12.5px/1.5 var(--sans)}
#alarm code{color:inherit;background:rgba(0,0,0,.06);border-radius:2px;padding:1px 4px;
  font:500 11.5px var(--mono)}
.dot.bad{background:var(--fault)} .dot.warm{background:var(--wait)}
.empty{padding:26px 22px;text-align:center;border:1px dashed var(--line);border-radius:3px;
  color:var(--muted);font-size:12.5px}
.empty b{display:block;font:600 14px var(--cond);color:var(--ink);margin-bottom:5px}

/* ---------- command dialog ---------- */
dialog#dlg{border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);
  padding:0;max-width:min(680px,93vw);width:100%;box-shadow:0 18px 48px rgba(0,0,0,.22)}
dialog#dlg::backdrop{background:rgba(16,22,25,.45)}
.dwrap{padding:15px 17px;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow-y:auto}
.dhead{display:flex;align-items:center;gap:10px}
.dhead h3{font:700 15px var(--cond);letter-spacing:.02em}
.dx{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--muted);
  font-size:13px;padding:2px 6px;border-radius:3px;line-height:1}
.dx:hover{background:var(--sunk);color:var(--ink)}
.dlede{font-size:12.5px;line-height:1.6;color:var(--muted);max-width:62ch;margin:0}
.dlede code{font:500 11.5px var(--mono);color:var(--signal)}
.dfields{display:flex;flex-direction:column;gap:11px}
.fr{display:flex;flex-direction:column;gap:4px}
.fl{font:600 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.fl .opt{font-weight:400;text-transform:none;letter-spacing:0}
.fi{font:400 12.5px var(--sans);color:var(--ink);background:var(--panel-2);
  border:1px solid var(--line);border-radius:3px;padding:6px 8px;width:100%;display:block}
textarea.fi{font:400 12.5px/1.55 var(--sans);resize:vertical}
.fi:focus-visible{outline:2px solid var(--signal);outline-offset:-1px;border-color:var(--signal)}
.fi.ro{font:400 11.5px var(--mono);color:var(--muted);background:transparent}
.fi.empty-sel{color:var(--wait);border-style:dashed}
.fh{font:400 11px/1.5 var(--sans);color:var(--faint);margin:0}
.fh code{font:500 10.5px var(--mono);color:var(--signal)}
.fradio{display:flex;gap:15px;flex-wrap:wrap;font-size:12.5px}
.fradio label,.fcheck{display:flex;align-items:center;gap:6px;cursor:pointer}
.fcheck{font-size:12.5px}
.dprev{border:1px solid var(--line-soft);border-radius:3px;background:var(--sunk)}
.dprev .pt{font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);padding:6px 9px 0}
.dprev .pt code{color:var(--signal);text-transform:none;letter-spacing:0}
.dprev pre{margin:0;padding:5px 9px 9px;font:400 11px/1.5 var(--mono);color:var(--ink-2);
  overflow-x:auto;max-height:200px}
.derr{border:1px solid var(--fault);border-left-width:2px;border-radius:3px;
  background:var(--fault-wash);padding:8px 10px}
.derr b{font:600 11px var(--mono);color:var(--fault)}
.derr p{margin:3px 0 0;font-size:12px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap}
.dres{border:1px solid var(--run);border-left-width:2px;border-radius:3px;
  background:var(--run-wash);padding:8px 10px}
.dres .rt{font:600 11px var(--mono);color:var(--run)}
.dres table.t{margin-top:6px;min-width:0}
.argv{margin:6px 0 0;padding:8px 10px;background:var(--ink);color:var(--panel);border-radius:3px;
  font:400 11.5px/1.55 var(--mono);overflow-x:auto;white-space:pre-wrap;word-break:break-all}
.dacts{display:flex;gap:8px;justify-content:flex-end}
.act.go{background:var(--signal);border-color:var(--signal);color:#fff;font-weight:600}
.act.go:hover:not([disabled]){filter:brightness(1.12)}
.act.go.danger{background:var(--fault);border-color:var(--fault)}
</style>
<style>
/* ---------- scope tree ---------- */
.tree{margin:0;padding:0;list-style:none;font-size:12.5px}
.tree ul{list-style:none;margin:0 0 0 9px;padding-left:9px;border-left:1px solid var(--line-soft)}
.srow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;
  padding:5px 8px;border-radius:3px;cursor:pointer}
.srow:hover{background:var(--panel-2)}
.srow[aria-current="true"]{background:var(--signal-wash);box-shadow:inset 2px 0 0 var(--signal)}
.srow .nm{font:600 12.5px var(--sans)}
.srow .pth{font:400 11px var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .ag{margin-left:auto;font:500 10.5px var(--mono);color:var(--muted);white-space:nowrap}
.srow.drift .ag{color:var(--wait)}
.srow:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}

/* ---------- agents & sessions ---------- */
.arow{display:grid;grid-template-columns:minmax(120px,1.3fr) minmax(90px,1fr) auto auto;
  gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.arow:last-child{border-bottom:0}
.arow .an{font:600 12.5px var(--sans)}
.arow .an small{display:block;font:400 10.5px var(--mono);color:var(--faint)}
.arow .hx{font:400 11.5px var(--mono);color:var(--ink-2)}
.arow .hx .mdl{display:block;font:400 10.5px var(--mono);color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess{border:1px solid var(--line-soft);border-radius:3px;padding:9px 11px;background:var(--panel-2)}
.sess + .sess{margin-top:8px}
.sess .sh{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sess .sid{font:600 12px var(--mono)}
.sess .ws{font:400 11px var(--mono);color:var(--muted);margin-top:4px;word-break:break-all}

/* ---------- task cards ---------- */
.tk{display:block;width:100%;text-align:left;border:1px solid var(--line-soft);background:var(--panel-2);
  border-radius:3px;padding:8px 9px;cursor:pointer;margin-bottom:7px}
.tk:last-child{margin-bottom:0}
.tk:hover{border-color:var(--signal)}
.tk[aria-current="true"]{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal)}
.tk .ti{display:flex;align-items:center;gap:6px;font:600 11px var(--mono);color:var(--muted)}
.tk .ti .src{margin-left:auto;font-weight:500;color:var(--faint)}
.tk .tp{font:400 12px/1.4 var(--sans);color:var(--ink);margin:4px 0 6px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tk .tm{display:flex;gap:8px;flex-wrap:wrap;font:400 10.5px var(--mono);color:var(--faint)}
.tk .tm b{font-weight:500;color:var(--muted)}
.tk:focus-visible{outline:2px solid var(--signal);outline-offset:1px}

/* ---------- task detail ---------- */
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:12px;margin:0}
.dl dt{font:500 10.5px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.06em;
  padding-top:2px;white-space:nowrap}
.dl dd{margin:0;font:400 11.5px var(--mono);color:var(--ink-2);word-break:break-word}
.dl dd.s{font:400 12px var(--sans);color:var(--ink)}
.prompt{font:400 12.5px/1.55 var(--sans);background:var(--panel-2);border:1px solid var(--line-soft);
  border-left:2px solid var(--ly4);border-radius:0 3px 3px 0;padding:9px 11px;margin:0 0 11px}
.blank{border:1px dashed var(--line);border-radius:3px;padding:11px 13px;background:transparent}
.blank .bt{font:600 12px var(--cond);letter-spacing:.03em;text-transform:uppercase;color:var(--wait);
  display:flex;align-items:center;gap:8px;margin-bottom:6px}

/* ---------- missing / build plan ---------- */
.miss{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 13px;align-items:start;font-size:12.5px}
.miss .qn{font:600 11.5px var(--mono);color:var(--wait);white-space:nowrap;padding-top:1px}
.miss .qd{color:var(--muted)} .miss .qd b{color:var(--ink-2);font-weight:600}
.evts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.evts i{font:500 11px var(--mono);font-style:normal;border:1px solid var(--line);border-radius:2px;
  padding:2px 6px;color:var(--ink-2);background:var(--panel-2)}
.evts i.na{color:var(--faint);border-style:dashed;background:transparent}
.big{font:700 27px/1 var(--cond);font-variant-numeric:tabular-nums;color:var(--ink)}
.big + .bl{font:400 11px var(--sans);color:var(--muted);margin-top:3px}
.stack{display:flex;flex-direction:column;gap:13px}
@media (max-width:860px){
  .body{grid-template-columns:minmax(0,1fr)}
  .levels{border-right:0;border-bottom:1px solid var(--line)}
  .main{padding:14px}
  .two{grid-template-columns:minmax(0,1fr)}
  .colm.inst{border-left:0;border-top:1px solid var(--line-soft)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<style>
/* ---------- the scope column ---------- */
.levels{padding:8px 10px 14px}
.srow{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;border:0;background:none;
  padding:6px 8px;border-radius:3px;cursor:pointer}
.srow.all{border:1px dashed var(--line);margin-bottom:10px}
.srow .ag{margin-left:auto}
.tfoot{margin-top:14px;padding:0 8px;font:400 11px/1.55 var(--sans);color:var(--faint)}
.tfoot code{font:500 10.5px var(--mono);color:var(--muted)}

/* ---------- scope head ---------- */
.shead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 16px;
  padding-bottom:11px;border-bottom:1px solid var(--line)}
.shead h2{font:700 20px var(--cond);letter-spacing:.01em}
.shead .spath{font:400 11.5px var(--mono);color:var(--muted)}
.shead .scount{margin-left:auto;font:500 11px var(--mono);color:var(--faint)}

/* ---------- one decision level ---------- */
.layer{border:1px solid var(--line);border-left:2px solid var(--c);border-radius:3px;
  background:var(--panel);margin-bottom:13px}
.layer > header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:9px 14px;border-bottom:1px solid var(--line-soft)}
.layer > header .lx{font:600 10.5px var(--mono);color:var(--c);border:1px solid var(--c);
  border-radius:2px;padding:1px 5px}
.layer > header h3{font:700 14px var(--cond);letter-spacing:.02em}
.layer > header .lsub{font:400 11.5px var(--sans);color:var(--muted)}
.layer.off{opacity:.72;background:transparent}
.layer.off > header h3{color:var(--faint)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.colm{padding:12px 14px;min-width:0}
.colm.inst{border-left:1px solid var(--line-soft);background:var(--panel-2)}
.colm > h4{margin:0 0 9px;font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint)}
.foot{margin:0;padding:10px 14px;border-top:1px solid var(--line-soft);background:var(--sunk);
  font:400 11.5px/1.6 var(--sans);color:var(--muted);border-radius:0 0 3px 3px}
.foot b{color:var(--ink-2);font-weight:600}
.foot code{font:500 11px var(--mono);color:var(--signal)}
.none{margin:0;font:400 12px var(--sans);color:var(--faint);padding:2px 0}
.later{padding:34px 17px 38px;font:400 13px var(--sans);color:var(--faint)}

/* ---------- one configured value, and where it came from ---------- */
.cell{display:grid;grid-template-columns:minmax(92px,auto) minmax(0,1fr) auto;gap:4px 10px;
  align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line-soft)}
.cell:last-child{border-bottom:0}
.cell .cl{font:500 10.5px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.cell .cv{font:400 12px var(--mono);color:var(--ink);word-break:break-all}
.cell .ck{font:500 9.5px var(--mono);letter-spacing:.04em;border-radius:2px;padding:1px 5px;
  white-space:nowrap;border:1px solid currentColor}
.cell .ch{grid-column:1/-1;font:400 11px/1.5 var(--sans);color:var(--faint)}
.k-own .ck{color:var(--signal)} .k-own .cv{font-weight:600}
.k-inherit .ck{color:var(--muted)} .k-inherit .cv{color:var(--ink-2)}
.k-instance .ck{color:var(--ly1)} .k-instance .cv{color:var(--ink-2)}
.k-derived .ck{color:var(--muted);border-style:dashed}
.k-none .ck{color:var(--faint);border-style:dashed} .k-none .cv{color:var(--faint)}
.ch{font:400 11px/1.55 var(--sans);color:var(--faint);margin:7px 0 0}
.ch code{font:500 10.5px var(--mono);color:var(--muted)}

/* ---------- the inherited context chain ---------- */
.chain{padding:8px 0 2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chain .cl{font:500 10.5px var(--mono);color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;width:100%}
.chain .lnk{font:400 11.5px var(--mono);color:var(--muted);border:1px solid var(--line);
  border-radius:2px;padding:2px 6px;background:var(--panel-2)}
.chain .lnk.own{color:var(--ink);border-color:var(--signal);font-weight:600}
.chain .lnk i{font-style:normal;color:var(--faint);margin-left:5px;font-size:10px}
.chain .arr{color:var(--faint)}
.chain .ch{width:100%;margin:2px 0 0}

/* ---------- an agent as declared ---------- */
.adef{border:1px solid var(--line-soft);border-radius:3px;padding:8px 10px;background:var(--panel-2)}
.adef + .adef{margin-top:8px}
.adef .ah{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.adef .ah b{font:600 13px var(--sans)}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;margin:0;font-size:12px}
dl.kv dt{font:500 10.5px var(--mono);color:var(--faint)}
dl.kv dd{margin:0;font:400 11.5px var(--mono);color:var(--ink-2);word-break:break-all}

/* ---------- plain facts ---------- */
.facts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:9px}
.fct{font:400 11.5px var(--sans);color:var(--muted)}
.fct b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.fct.m{font:400 11.5px var(--mono);color:var(--ink-2);word-break:break-all}

/* ---------- tasks by status ---------- */
.tgrp + .tgrp{margin-top:11px}
.tgrp h5{margin:0 0 6px;display:flex;align-items:center;gap:7px;font:inherit}
.tdet{margin-top:11px;border-top:1px solid var(--line);padding-top:11px}

/* ---------- the comparison ---------- */
table.t.mx td{font-size:11.5px;vertical-align:top}
table.t.mx td.k-own{color:var(--ink)}
table.t.mx td.k-instance{color:var(--ly1);font:500 11px var(--mono)}
table.t.mx td.k-none{color:var(--faint)}
.lnkb{border:0;background:none;padding:0;cursor:pointer;font:600 12.5px var(--sans);color:var(--signal)}
.lnkb:hover{text-decoration:underline}

/* ---------- the level tabs ---------- */
.tabs{display:flex;gap:0;overflow-x:auto;background:var(--panel-2);
  border-bottom:1px solid var(--line)}
.tab{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;
  gap:0 8px;align-items:baseline;flex:1 1 0;min-width:132px;
  border:0;border-right:1px solid var(--line-soft);border-top:2px solid transparent;
  background:none;text-align:left;cursor:pointer;padding:8px 14px 9px}
.tab .n{grid-row:1/3;align-self:center;font:600 12px var(--mono);color:var(--c)}
.tab .t{font:600 13px/1.2 var(--cond);letter-spacing:.01em;white-space:nowrap}
.tab .s{font:400 10.5px var(--sans);color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tab:hover{background:var(--panel)}
.tab[aria-current="true"]{background:var(--panel);border-top-color:var(--c)}
.tab[aria-current="true"] .t{color:var(--ink)}
.tab.off .t{color:var(--faint)} .tab.off .n{opacity:.55} .tab.off .s{color:var(--faint)}
.tab:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}

/* One level fills the page, so the card no longer needs to stack. */
.layer{margin-bottom:0}
.layer > header{padding:11px 16px}
.colm{padding:15px 17px}

/* The tab also names a column of the comparison. */
table.t.mx th.on{color:var(--signal)}
table.t.mx.c1 td:nth-child(2),table.t.mx.c2 td:nth-child(3){background:var(--signal-wash)}
@media (max-width:860px){
  .tab{flex:0 0 auto;min-width:0;padding:7px 11px}
  .tab .s{display:none}
}

/* ---------- L4: the board ---------- */
.layer.wide > header{align-items:center}
.hacts{margin-left:auto;display:flex;gap:7px}
.lane + .lane{border-top:1px solid var(--line-soft)}
.lanehead{display:flex;align-items:center;gap:10px;padding:9px 16px 0}
.lanehead .lnkb{font:700 13px var(--cond);letter-spacing:.02em;color:var(--ink)}
.lanehead .lnkb:hover{color:var(--signal)}
.lanehead .act{margin-left:auto;padding:3px 8px;font-size:11.5px}
.lanehead .act code{display:none}
.board{display:grid;grid-template-columns:repeat(6,minmax(172px,1fr));gap:10px;
  padding:11px 16px 14px;overflow-x:auto;align-items:start}
.col{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:3px;
  padding:8px;min-width:0}
.col > h4{margin:0 0 7px;display:flex;justify-content:space-between;align-items:baseline;gap:6px;
  font:700 10px var(--mono);letter-spacing:.09em;text-transform:uppercase}
.col > h4 span{font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
.col.c-queued > h4{color:var(--signal)} .col.c-running > h4{color:var(--run)}
.col.c-blocked > h4{color:var(--wait)} .col.c-done > h4{color:var(--ink-2)}
.col.c-failed > h4{color:var(--fault)} .col.c-cancelled > h4{color:var(--faint)}
.col .none{padding:1px;color:var(--line)}
/* A column past five cards keeps the page one screen tall. */
.col.dense .tk{padding:5px 7px;margin-bottom:4px}
.col.dense .tk .tp{-webkit-line-clamp:1;font-size:11.5px;margin:2px 0 0}
.col.dense .tk .tm{display:none}
@media (max-width:1180px){.board{grid-template-columns:repeat(6,minmax(148px,1fr))}}


/* ---------- L4, second view: occupancy ---------- */
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{padding:4px 11px;font:500 11.5px var(--sans);color:var(--muted);
  background:var(--panel);border:0;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--signal);color:#fff}
.seg button:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.tl{padding:13px 16px 16px}
.tl-axis{display:flex;height:17px;margin:2px 78px 0 210px;border-bottom:1px solid var(--line)}
.tl-axis span{flex:1;font:400 9.5px var(--mono);color:var(--faint);position:relative}
.tl-axis span::before{content:"";position:absolute;left:0;bottom:-1px;width:1px;height:5px;
  background:var(--line)}
.tl-grp{font:600 9px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  margin:13px 0 5px;padding-top:9px;border-top:1px solid var(--line-soft)}
.tl-grp:first-of-type{margin-top:9px;padding-top:0;border-top:0}
.tl-row{display:flex;align-items:center;height:26px}
.tl-lab{flex:0 0 210px;padding-right:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font:400 11px var(--sans);color:var(--ink-2)}
.tl-lab b{font:600 12px var(--sans);color:var(--ink)}
.tl-lab b.q{color:var(--signal)}
.tl-lab .sid{font:500 10.5px var(--mono);color:var(--muted)}
.tl-lab .cont{color:var(--faint)}
.tl-lab .s{font:400 10px var(--mono);color:var(--faint);margin-left:6px}
.tl-lab.free{color:var(--faint)}
.tl-track{flex:1;position:relative;height:19px;min-width:0;border-radius:2px;background:var(--sunk);
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(16.666% - 1px),
    var(--line-soft) calc(16.666% - 1px),var(--line-soft) 16.666%)}
.tl-util{flex:0 0 78px;padding-left:11px;text-align:right;font:500 10px var(--mono);
  color:var(--muted);font-variant-numeric:tabular-nums}
.blk{position:absolute;top:0;bottom:0;border-radius:2px;overflow:hidden;padding:0 5px;
  font:500 9.5px/19px var(--mono);color:#fff;white-space:nowrap;text-overflow:ellipsis}
.blk.run{background:var(--idle)}
.blk.live{background:var(--run)}
.blk.wait{background:var(--wait);
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 4px,transparent 4px 8px)}
.blk.scrap{background:var(--fault);
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.26) 0 4px,transparent 4px 8px)}

.blk.tiny{padding:0 2px;font-size:0}
.tl-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:15px;padding-top:10px;
  border-top:1px solid var(--line);font:400 10.5px var(--mono);color:var(--muted)}
.tl-legend i.blk{position:static;display:inline-block;width:16px;height:9px;margin-right:6px;
  vertical-align:-1px;padding:0}
.why{margin:13px 0 0;padding:10px 12px;border-left:2px solid var(--signal);background:var(--signal-wash);
  font:400 11.5px/1.6 var(--sans);color:var(--ink-2);border-radius:0 3px 3px 0}
.why b{color:var(--ink);font-weight:600}
.why code{font:500 11px var(--mono);color:var(--signal)}
@media (max-width:860px){
  .tl-axis{margin-left:120px;margin-right:54px}
  .tl-lab{flex-basis:120px} .tl-util{flex-basis:54px}
}

<body>
<div id="shell">
  <div class="mast">
    <span class="nm">Factory Leitstand</span>
    <span class="sub">Scope links, Ebenen untereinander — je Ebene links die Konfiguration, rechts die Instanz.</span>
    <span class="wire-counts">
      <span><b>13</b> Queries</span><span><b>20</b> Kommandos</span><span><b>0</b> Abos</span>
    </span>
  </div>
  <div id="alarm" hidden></div>
  <nav class="tabs" id="tabs" aria-label="Entscheidungsebenen"></nav>
  <div class="body">
    <nav class="levels" id="tree" aria-label="Scopes"></nav>
    <main class="main" id="main"></main>
  </div>
  <div class="wire">
    <span><span class="dot" id="dot"></span><b id="live">verbinde …</b></span>
    <span><span class="k">socket</span> <b id="sock">—</b></span>
    <span><span class="k">letzter aufruf</span> <b id="lastcall">—</b></span>
    <span><span class="k">aufrufe</span> <b id="ncalls">—</b> je Durchgang</span>
    <span><span class="k">aktualisierung</span> alle 5 s — kein Abo auf dem Draht</span>
  </div>
</div>
<dialog id="dlg" aria-label="Kommando"></dialog>
<script>
(function(){
'use strict';

/* ------------------------------------------------------------------ *
 * The data layer. Every value this page shows comes back from one of
 * the daemon's own queries, through the one endpoint the HTTP
 * transport exposes — the same ADR 0003 envelope the Unix socket
 * takes. Nothing here is stored, derived from a second source, or
 * carried over from a previous poll.
 * ------------------------------------------------------------------ */

var ZERO='00000000-0000-0000-0000-000000000000';
var POLL_MS=5000;

var S={scopes:[],agents:{},targetable:{},refusal:{},sessions:[],tasks:[],
       schedules:[],daemon:null,root:ZERO,calls:0,loaded:false};
var cur='harn', selScope=null, selTask=null, timer=null, inflight=false, booted=false;

function $(s){return document.querySelector(s)}
function uuid(){
  if(window.crypto&&window.crypto.randomUUID)return window.crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g,function(){
    return (Math.random()*16|0).toString(16);
  });
}

/* One request. A refusal from the daemon is thrown with its code attached, so
   a caller can tell `not_found.scope` from a transport failure. */
function send(kind,name,payload,scopeId){
  var body={request_id:uuid(),scope_id:scopeId||ZERO,payload:payload||{}};
  body.api=(kind==='q')?'factory.query/v1':'factory.command/v1';
  if(kind==='q')body.query=name; else body.command=name;
  S.calls++;
  return fetch('/api',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  }).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(j){
    if(j.api==='factory.error/v1'){
      var e=new Error(j.error.message); e.code=j.error.code; throw e;
    }
    return j.result;
  });
}
function q(name,payload,scopeId){return send('q',name,payload,scopeId)}

function load(){
  var calls0=S.calls, agents={}, targ={}, refus={}, sessions=[];
  return q('daemon.status').then(function(d){
    S.daemon=d;
    return q('scope.list');
  }).then(function(r){
    S.scopes=r.scopes||[];
    var root=S.scopes.filter(function(s){return !s.parent_id})[0];
    S.root=root?root.id:ZERO;
    if(!S.scopes.length)return {scopes:[]};
    // `agent.list` is the one operation that reads the caller's scope from the
    // payload rather than the envelope: targetability is relative to whoever
    // is asking. The page asks as the root scope, and says so on L3.
    return q('agent.list',{scope_id:S.root},S.root);
  }).then(function(r){
    (r.scopes||[]).forEach(function(e){
      agents[e.scope_id]=e.agents||[];
      targ[e.scope_id]=e.targetable;
      if(e.refusal_reason)refus[e.scope_id]=e.refusal_reason;
    });
    S.agents=agents; S.targetable=targ; S.refusal=refus;
    // One call per scope: `agent.status` filters on the envelope's scope and
    // there is no factory-wide session query. See the note on L3.
    return S.scopes.reduce(function(chain,sc){
      return chain.then(function(){
        return q('agent.status',{},sc.id).then(function(r2){
          (r2.sessions||[]).forEach(function(x){sessions.push(x)});
        });
      });
    },Promise.resolve());
  }).then(function(){
    S.sessions=sessions;
    return q('task.list');
  }).then(function(r){
    S.tasks=r.tasks||[];
    return q('schedule.list');
  }).then(function(r){
    S.schedules=r.schedules||[];
    S.loaded=true;
    // Keep the selection only while it still exists: a task can finish and a
    // scope can be removed between two polls.
    if(selScope!=='*'&&!S.scopes.some(function(x){return x.id===selScope}))
      selScope=S.scopes.length?S.root:null;
    if(!S.tasks.some(function(t){return t.id===selTask}))
      selTask=S.tasks.length?S.tasks[0].id:null;
    return S.calls-calls0;
  });
}

function alarm(message){
  var el=$('#alarm');
  if(!message){el.hidden=true; el.textContent=''; return}
  el.hidden=false; el.innerHTML=message;
}
function wire(nCalls,ok){
  $('#dot').className='dot'+(ok?'':' bad');
  $('#live').textContent=ok?'daemon antwortet':'daemon antwortet nicht';
  $('#sock').textContent=S.daemon?S.daemon.socket_path:'—';
  if(nCalls!=null)$('#ncalls').textContent=nCalls;
}

/* ------------------------------------------------------------------ *
 * Helpers shared by every view.
 * ------------------------------------------------------------------ */

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function ago(iso){
  if(!iso)return '—';
  var t=Date.parse(iso.length<=19&&iso.indexOf('Z')<0?iso+'Z':iso);
  if(isNaN(t))return '—';
  var m=Math.round((Date.now()-t)/60000);
  if(m<0)return 'in '+(-m)+' min';
  if(m<1)return 'gerade eben';
  if(m<60)return m+' min';
  var h=Math.floor(m/60);
  if(h<24)return h+' h'+(m%60?' '+(m%60)+' min':'');
  return Math.floor(h/24)+' d'+(h%24?' '+(h%24)+' h':'');
}
function stamp(iso){return iso?esc(String(iso).replace('T',' ').replace(/\.\d+Z?$/,'').replace(/Z$/,'')):'—'}
function kn(n){return n==null?'—':(n>=1000?(Math.round(n/100)/10).toFixed(1).replace('.',',')+'k':String(n))}
function dur(ms){
  if(ms==null)return '—';
  var m=Math.round(ms/60000);
  return m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min';
}
/* The tail, not the head: the store mints UUIDv7, whose leading bytes are a
   timestamp. Two ids created in the same second share their first eight
   characters, so a leading abbreviation makes every card look alike. */
function shortId(id){return id?String(id).replace(/-/g,'').slice(-8):'—'}
function tilde(p){return String(p||'').replace(/^\/Users\/[^/]+/,'~')}
function qc(n,w){return '<span class="q'+(w?' w':'')+'">'+esc(n)+'</span>'}
/* `ctx` is what the dialog cannot work out for itself: which scope the
   envelope is addressed to, and which ids the payload already carries. */
function act(label,cmd,dis,why,ctx){
  return '<button class="act" data-cmd="'+esc(cmd)+'"'+
    (ctx?' data-ctx="'+esc(JSON.stringify(ctx))+'"':'')+
    (dis?' disabled title="'+esc(why||'')+'"':'')+'>'+esc(label)+' <code>'+esc(cmd)+'</code></button>';
}
var STATE_CLS={running:'run',starting:'wait',disconnected:'wait',failed:'fault',stopped:'idle'};
var AVAIL_CLS={busy:'run',idle:'idle',starting:'wait',no_session:'ghost',unknown:'ghost'};
var TASK_CLS={running:'run',queued:'sig',blocked:'wait',failed:'fault',done:'idle',cancelled:'ghost'};
var STATUSES=[
 {k:'queued',t:'queued'},{k:'running',t:'running'},{k:'blocked',t:'blocked'},
 {k:'done',t:'done'},{k:'failed',t:'failed'},{k:'cancelled',t:'cancelled'}
];

function live(list){return list.filter(function(s){
  return s.state!=='stopped'&&s.state!=='failed'})}

var LEVELS=[
 {k:'dir',  n:'L6',t:'Richtung',     s:'Ziele, Budget, Stückkosten',c:'--ly6',off:true},
 {k:'imp',  n:'L5',t:'Verbesserung', s:'Verlauf und Entscheidungen',c:'--ly5',off:true},
 {k:'proc', n:'L4',t:'Prozess',      s:'Regeln und Läufe',     c:'--ly4'},
 {k:'harn', n:'L3',t:'Agent',        s:'Wer arbeiten darf',    c:'--ly3'},
 {k:'env',  n:'L2',t:'Umgebung',     s:'Verzeichnis und Lease',c:'--ly2',off:true},
 {k:'infra',n:'L1',t:'Infrastruktur',s:'Daemon und Store',     c:'--ly1',off:true}
];
function lv(kk){for(var i=0;i<LEVELS.length;i++)if(LEVELS[i].k===kk)return LEVELS[i]}

function empty(title,body){
  return '<div class="empty"><b>'+esc(title)+'</b>'+body+'</div>';
}
function scopeById(id){for(var i=0;i<S.scopes.length;i++)if(S.scopes[i].id===id)return S.scopes[i]}
function sessById(id){for(var i=0;i<S.sessions.length;i++)if(S.sessions[i].id===id)return S.sessions[i]}
function taskById(id){for(var i=0;i<S.tasks.length;i++)if(S.tasks[i].id===id)return S.tasks[i]}
function kids(pid){return S.scopes.filter(function(s){return (s.parent_id||null)===pid})}

/* ------------------------------------------------------------------ *
 * Rendering. The scope tree is the navigation; the decision levels are
 * the rows. Every row splits the same way: what is *declared* on the
 * left, what *exists* on the right. Configuration can be inherited;
 * an instance never is — it runs or it does not.
 * ------------------------------------------------------------------ */

function layer(kk,cfg,inst,foot){
  var l=lv(kk);
  return '<section class="layer'+(l.off?' off':'')+'" style="--c:var('+l.c+')">'+
    '<header><span class="lx">'+l.n+'</span><h3>'+esc(l.t)+'</h3>'+
    '<span class="lsub">'+esc(l.s)+'</span></header>'+
    '<div class="two"><div class="colm"><h4>Konfiguration</h4>'+cfg+'</div>'+
    '<div class="colm inst"><h4>Instanz</h4>'+inst+'</div></div>'+
    (foot?'<p class="foot">'+foot+'</p>':'')+'</section>';
}
function nothing(t){return '<p class="none">'+esc(t)+'</p>'}

function rootScope(){return scopeById(S.root)}
function sessionsOf(id){return S.sessions.filter(function(s){return s.scope_id===id})}
function tasksOf(id){return S.tasks.filter(function(t){return t.target_scope_id===id})}
/* ---------- the tree, which is the filesystem ---------- */
/* `parent_id` is not declared anywhere: `factory-registry` derives it by
   finding the deepest registered path that contains this one. The tree on
   the left is therefore the directory nesting, not a second hierarchy
   somebody has to keep in step with it. */
function treeHtml(pid){
  var ks=kids(pid); if(!ks.length)return '';
  return '<ul class="tree">'+ks.map(function(s){
    var ag=(S.agents[s.id]||[]).length, running=live(sessionsOf(s.id)).length;
    return '<li><button class="srow" data-scope="'+esc(s.id)+'"'+
      (s.id===selScope?' aria-current="true"':'')+'>'+
      '<span class="nm">'+esc(s.name)+'</span>'+
      '<span class="pth">'+esc(s.declared_path)+'</span>'+
      '<span class="ag">'+(running?'<b>'+running+'</b> läuft':(ag?ag+' Ag.':'—'))+'</span>'+
      '</button>'+treeHtml(s.id)+'</li>';
  }).join('')+'</ul>';
}
/* L6 on the left, L1 on the right: read downward through the levels and you
   are reading from what the factory is for toward what it runs on. Only the
   selected one is on the page — a level is a place you go, not a row you
   scroll past. */
function renderTabs(){
  $('#tabs').innerHTML=LEVELS.map(function(l){
    return '<button class="tab'+(l.off?' off':'')+'" data-go="'+l.k+'" style="--c:var('+l.c+')"'+
      (l.k===cur?' aria-current="true"':'')+'>'+
      '<span class="n">'+l.n+'</span><span class="t">'+esc(l.t)+'</span>'+
      '<span class="s">'+esc(l.s)+'</span></button>';
  }).join('');
}
function renderTree(){
  var r=rootScope();
  $('#tree').innerHTML='<div class="lvtitle">Scopes</div>'+
    '<button class="srow all" data-scope="*"'+(selScope==='*'?' aria-current="true"':'')+'>'+
      '<span class="nm">Alle Scopes</span><span class="ag">Vergleich</span></button>'+
    (r?'<ul class="tree"><li><button class="srow" data-scope="'+esc(r.id)+'"'+
      (r.id===selScope?' aria-current="true"':'')+'>'+
      '<span class="nm">'+esc(r.name)+'</span><span class="pth">'+esc(r.declared_path)+'</span>'+
      '<span class="ag">Wurzel</span></button>'+treeHtml(r.id)+'</li></ul>':'')+
    '<p class="tfoot">Der Baum kommt aus <code>parent_id</code>, und das wird nicht '+
    'deklariert, sondern aus der Pfadverschachtelung abgeleitet.</p>';
}

/* A level that is not built yet says so, and says nothing else. An empty
   level dressed up with an account of what it would hold reads like a
   feature; one plain line reads like a plan. */
function soon(kk){
  var l=lv(kk);
  return '<section class="layer off" style="--c:var('+l.c+')">'+
    '<header><span class="lx">'+l.n+'</span><h3>'+esc(l.t)+'</h3>'+
    '<span class="lsub">'+esc(l.s)+'</span></header>'+
    '<div class="later">Kommt später.</div></section>';
}

/* ---------- L3 ---------- */
function secAgent(sc){
  var ags=S.agents[sc.id]||[], sess=sessionsOf(sc.id);
  var cfg=ags.length?ags.map(function(a){
    return '<div class="adef"><div class="ah"><b>'+esc(a.name)+'</b>'+
      '<span class="pill '+(AVAIL_CLS[a.availability]||'ghost')+'">'+esc(a.availability)+'</span></div>'+
      '<dl class="kv">'+
      '<dt>harness</dt><dd>'+esc(a.harness)+'</dd>'+
      '<dt>model</dt><dd>'+(a.model?esc(a.model):
        '<span class="faint">keine Angabe — der Harness entscheidet</span>')+'</dd>'+
      '<dt>max_sessions</dt><dd>'+esc(a.max_sessions)+'</dd>'+
      '<dt>lifetime</dt><dd>'+esc(a.lifetime)+'</dd>'+
      '</dl></div>';
  }).join(''):nothing('Kein Agent deklariert. Der Scope ist registriert, aber niemand kann hier arbeiten.');
  var inst=sess.length?sess.map(function(s){
    return '<div class="sess"><div class="sh">'+
      '<span class="pill '+(STATE_CLS[s.state]||'ghost')+'">'+esc(s.state)+'</span>'+
      '<span class="sid">'+esc(shortId(s.id))+'</span>'+
      '<span class="muted">'+esc(s.agent_name)+'</span>'+
      '<span class="faint">'+esc(ago(s.updated_at))+'</span></div>'+
      '<div class="ws">'+esc(tilde(s.workspace_path))+'</div>'+
      (s.state==='running'||s.state==='disconnected'?
        '<div class="acts">'+act('Beenden','agent.stop',false,'',
          {scope_id:sc.id,session_id:s.id})+'</div>':'')+
      '</div>';
  }).join(''):nothing('Keine Sitzung — weder laufend noch beendet.');
  if(ags.length)inst+='<div class="acts">'+act('Agent starten','agent.start',false,'',{scope_id:sc.id})+'</div>';
  return layer('harn',cfg,inst,
    'Die Ebene heißt Agent, nicht Harness: <code>harness</code> ist ein Feld des Agenten, nicht '+
    'umgekehrt. <b>Was hier steht, ist der aufgelöste Wert.</b> <code>agent.list</code> liefert '+
    '<code>max_sessions</code> und <code>lifetime</code> immer gefüllt — ob jemand sie geschrieben '+
    'hat oder ob die Vorgabe greift, steht nicht auf dem Draht. Nur <code>model</code> hat einen '+
    'sichtbar leeren Zustand. Ein <code>defaults:</code>-Block auf Instanzebene existiert nicht: '+
    '<code>RawInstance</code> kennt genau <code>id</code> und <code>name</code>.');
}

/* ---------- L4: the board ---------- */
/* A scope's work is not only its own: a parent's board shows every task that
   targets anything inside it, one swimlane per scope, because that is the
   question a parent scope is actually asking. The lane is the task's
   `target_scope_id` — the scope the run was sent *to*, not the one it came
   from. */
function subtreeOf(id){
  var out=[id];
  (function walk(pid){kids(pid).forEach(function(k){out.push(k.id); walk(k.id)})})(id);
  return out;
}
function agentOfTask(t){
  var se=t.assigned_session_id?sessById(t.assigned_session_id):null;
  return se?se.agent_name:null;
}
function card(t,dense){
  var who=agentOfTask(t);
  var from=(t.sender_scope_id&&t.sender_scope_id!==t.target_scope_id)?scopeById(t.sender_scope_id):null;
  return '<button class="tk'+(dense?' dense':'')+'" data-task="'+esc(t.id)+'"'+
    (t.id===selTask?' aria-current="true"':'')+'>'+
    '<div class="ti">'+esc(shortId(t.id))+
      (from?'<span class="src">← '+esc(from.name)+'</span>':
        (t.template_id?'<span class="src">cron</span>':''))+'</div>'+
    '<div class="tp">'+esc(t.prompt)+'</div>'+
    '<div class="tm">'+(who?'<b>'+esc(who)+'</b>':'<span class="faint">ohne Agent</span>')+
      '<span>'+esc(ago(t.created_at))+'</span>'+
      (t.blocked_reason?'<b>'+esc(t.blocked_reason)+'</b>':'')+'</div></button>';
}
/* More than five cards in one column and the column decides the page height.
   Past that the cards drop to a single line — the same information, ranked by
   what you scan a full column for: which task, and whose. */
function boardFor(scopeId){
  var ts=tasksOf(scopeId);
  return '<div class="board">'+STATUSES.map(function(st){
    var rows=ts.filter(function(t){return t.status===st.k});
    var dense=rows.length>5;
    return '<div class="col c-'+st.k+(dense?' dense':'')+'">'+
      '<h4>'+esc(st.t)+'<span>'+(rows.length||'')+'</span></h4>'+
      (rows.length?rows.map(function(t){return card(t,dense)}).join('')
                  :'<p class="none">—</p>')+'</div>';
  }).join('')+'</div>';
}

/* ---------- L4, second view: who is occupied ---------- */
/* The board asks "what state is the work in". This asks the other question:
   "who is carrying it". Rows are agents and their sessions, so an idle bay is
   as visible as a busy one — a queue next to empty rows is the whole point.

   A block is a task's *lifetime*, from `created_at` to `updated_at` (or now,
   while it runs). It is deliberately not called execution time: the store
   knows exactly when a task was delivered and when it started running, in
   `task_events` — and no query returns that. When `task.events` lands, these
   blocks get their real edges. Until then only a task that carries an
   `assigned_session_id` is drawn at all, because that is the only tie between
   a run and a bay the wire will hand over. */
var procView='board';

function tsOf(iso){
  if(!iso)return NaN;
  var s=String(iso);
  return Date.parse(s.length<=19&&s.indexOf('Z')<0?s.replace(' ','T')+'Z':s);
}
function hhmm(ms){
  var d=new Date(ms);
  return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}
var BLK={done:'run',running:'live',blocked:'wait',failed:'scrap',cancelled:'scrap',queued:'plan'};

function occRow(label,sub,tasks,win,extra){
  var t0=win[0], span=win[1]-win[0];
  var busy=0;
  var blocks=tasks.map(function(t){
    var a=Math.max(tsOf(t.created_at),t0), b=Math.min(tsOf(t.updated_at)||win[1],win[1]);
    if(t.status==='running')b=win[1];
    if(!(b>a))return '';
    busy+=b-a;
    var left=(a-t0)/span*100, w=(b-a)/span*100;
    return '<span class="blk '+(BLK[t.status]||'run')+(w<3?' tiny':'')+'" '+
      'style="left:'+left.toFixed(2)+'%;width:'+Math.max(w,0.6).toFixed(2)+'%" '+
      'title="'+esc(shortId(t.id)+' · '+t.status+' · '+t.prompt.slice(0,70))+'">'+
      esc(shortId(t.id))+'</span>';
  }).join('');
  var util=span?Math.min(100,Math.round(busy/span*100)):0;
  return '<div class="tl-row"><div class="tl-lab'+(tasks.length?'':' free')+'">'+label+
    (sub?'<span class="s">'+sub+'</span>':'')+'</div>'+
    '<div class="tl-track">'+blocks+'</div>'+
    '<div class="tl-util">'+(extra!=null?extra:(tasks.length?util+' %':'frei'))+'</div></div>';
}

function occFor(sc){
  var lanes=subtreeOf(sc.id), all=[];
  lanes.forEach(function(id){tasksOf(id).forEach(function(t){all.push(t)})});
  var assigned=all.filter(function(t){return t.assigned_session_id});
  var now=Date.now(), HOUR=3600000;
  var earliest=assigned.reduce(function(m,t){
    var v=tsOf(t.created_at); return isNaN(v)?m:Math.min(m,v)}, now);
  var span=Math.max(2*HOUR,Math.min(24*HOUR,(now-earliest)*1.15));
  var win=[now-span,now];
  var ticks='';
  for(var i=0;i<6;i++)ticks+='<span>'+hhmm(win[0]+span*i/6)+'</span>';

  var body=lanes.map(function(id){
    var s2=scopeById(id); if(!s2)return '';
    var ags=S.agents[id]||[], sess=sessionsOf(id);
    var loose=tasksOf(id).filter(function(t){return !t.assigned_session_id});
    var rows=ags.map(function(a){
      /* A bay is worth a row while it is alive, or while it still carries a
         block inside the window. A stopped session with nothing in it is not
         occupancy, it is history. */
      var mine=sess.filter(function(x){
        return x.agent_name===a.name&&(x.state!=='stopped'&&x.state!=='failed'||
          assigned.some(function(t){return t.assigned_session_id===x.id}));
      });
      mine.sort(function(x,y){return (tsOf(y.updated_at)||0)-(tsOf(x.updated_at)||0)});
      if(!mine.length)return occRow('<b>'+esc(a.name)+'</b>','keine Sitzung',[],win,'—');
      return mine.map(function(x,n){
        var ts=assigned.filter(function(t){return t.assigned_session_id===x.id});
        return occRow((n===0?'<b>'+esc(a.name)+'</b>':'<span class="cont">↳</span>')+
          ' <span class="sid">'+esc(shortId(x.id))+'</span>',
          esc(x.state),ts,win);
      }).join('');
    }).join('');
    if(loose.length)rows+=occRow('<b class="q">nicht zugeteilt</b>','wartet auf einen Agenten',
      [],win,loose.length+(loose.length===1?' Task':' Tasks'));
    return '<div class="tl-grp">'+esc(s2.name)+'</div>'+
      (rows||occRow('<b class="faint">kein Agent</b>','',[],win,'—'));
  }).join('');

  return '<div class="tl"><div class="tl-axis">'+ticks+'</div>'+body+
    '<div class="tl-legend">'+
      '<span><i class="blk live"></i>läuft</span>'+
      '<span><i class="blk run"></i>fertig</span>'+
      '<span><i class="blk wait"></i>blockiert</span>'+
      '<span><i class="blk scrap"></i>gescheitert oder abgebrochen</span>'+
      '<span class="faint">Fenster: '+Math.round(span/HOUR*10)/10+' h bis jetzt</span>'+
    '</div>'+
    '<p class="why"><b>Ein Balken ist die Lebensdauer einer Task</b>, von <code>created_at</code> bis '+
    '<code>updated_at</code> — nicht ihre Laufzeit. Wann eine Task zugestellt wurde und wann sie '+
    'wirklich zu laufen begann, steht in <code>task_events</code>, und dafür gibt es keine Query. '+
    'Gezeichnet wird nur, was eine <code>assigned_session_id</code> trägt: die einzige Verbindung '+
    'zwischen einem Lauf und einer Sitzung, die der Draht hergibt. Alles andere steht in der Zeile '+
    '„nicht zugeteilt".</p></div>';
}

function secProc(sc){
  var lanes=subtreeOf(sc.id), many=lanes.length>1;
  var total=lanes.reduce(function(n,id){return n+tasksOf(id).length},0);
  var body=procView==='occ'?'':lanes.map(function(id){
    var s2=scopeById(id); if(!s2)return '';
    var n=tasksOf(id).length;
    return '<div class="lane">'+(many?'<div class="lanehead">'+
      '<button class="lnkb" data-scope="'+esc(id)+'">'+esc(s2.name)+'</button>'+
      '<span class="faint">'+n+(n===1?' Task':' Tasks')+'</span>'+
      act('+ Task','task.send',false,'',{scope_id:id})+'</div>':'')+
      boardFor(id)+'</div>';
  }).join('');
  var sel=taskById(selTask);
  var l=lv('proc');
  return '<section class="layer wide" style="--c:var('+l.c+')">'+
    '<header><span class="lx">'+l.n+'</span><h3>'+esc(l.t)+'</h3>'+
    '<span class="lsub">'+total+(total===1?' Task':' Tasks')+
      (many?' in '+lanes.length+' Scopes':'')+'</span>'+
    '<div class="hacts"><div class="seg">'+
      '<button data-pview="board"'+(procView==='board'?' class="on"':'')+'>Board</button>'+
      '<button data-pview="occ"'+(procView==='occ'?' class="on"':'')+'>Belegung</button></div>'+
      act('Task anlegen','task.send',false,'',{scope_id:sc.id})+'</div>'+
    '</header>'+
    (total?(procView==='occ'?occFor(sc):body)
          :'<div class="later">Noch keine Task in diesem Scope. '+
      '<button class="lnkb" data-cmd="task.send" data-ctx="'+
      esc(JSON.stringify({scope_id:sc.id}))+'">Die erste anlegen.</button></div>')+
    (sel&&lanes.indexOf(sel.target_scope_id)>=0?taskDetail(sel):'')+
    '</section>';
}

/* ---------- one scope, one level ---------- */
var SECTION={harn:secAgent,proc:secProc};
function viewScope(){
  var sc=scopeById(selScope);

/* ---------- all scopes: where they differ ---------- */
function viewMatrix(){
  var rows=[], depth={};
  (function walk(pid,d){
    kids(pid).forEach(function(s){depth[s.id]=d; rows.push(s); walk(s.id,d+1)});
  })(null,0);
  var body=rows.map(function(s){
    var ags=S.agents[s.id]||[];
    var models={}; ags.forEach(function(a){models[a.model||'(keins)']=1});

      '<td class="'+(tasksOf(s.id).length?'k-own':'k-none')+'">'+
        (tasksOf(s.id).length||'—')+'</td></tr>';

  var allModels={}, allHarness={};
  S.scopes.forEach(function(s){(S.agents[s.id]||[]).forEach(function(a){
    allModels[a.model||'(keins)']=(allModels[a.model||'(keins)']||0)+1;

  var mKeys=Object.keys(allModels), hKeys=Object.keys(allHarness);
  var col={harn:1,proc:2}[cur]||0;
  function th(i,label){return '<th'+(i===col?' class="on"':'')+'>'+esc(label)+'</th>'}
  return '<div class="shead"><h2>Alle Scopes</h2><span class="spath">Wo sie sich unterscheiden — '+
    'und wo sie nur denselben Wert tragen</span>'+
    (col?'<span class="scount">'+esc(lv(cur).n+' '+lv(cur).t)+' hervorgehoben</span>':'')+'</div>'+
    '<div class="card"><div class="tw"><table class="t mx c'+col+'"><thead><tr><th>Scope</th>'+

    ' — das sind unabhängige Zeichenketten in je eigenen Zeilen, und es gibt keinen Mechanismus, '+
    'der sie aneinander bindet.</p>'+
    '<p class="note faint">L1 und L2 kommen später in den Vergleich.</p></div>'+
    '<div class="card"><h3>Instanzweit, für jeden Scope gleich '+qc('schedule.list')+'</h3>'+
    (S.schedules.length?'<div class="tw"><table class="t"><thead><tr><th>Template</th><th>Cron</th>'+
      '<th>Zuletzt</th><th></th></tr></thead><tbody>'+S.schedules.map(function(s){
      return '<tr><td>'+esc(s.template_name||shortId(s.template_id))+'</td>'+
        '<td class="m">'+esc(s.cron)+' <span class="faint">'+esc(s.timezone)+'</span></td>'+
        '<td class="m">'+(s.last_fired_at?esc(ago(s.last_fired_at)):'<span class="faint">nie</span>')+'</td>'+
        '<td><span class="pill '+(s.enabled?'run':'ghost')+'">'+(s.enabled?'aktiv':'aus')+'</span></td></tr>';
      }).join('')+'</tbody></table></div>':nothing('Kein Schedule angelegt.'))+

}

/* The one detail panel that survived the rebuild: a task card opens what the
   store knows about that run, and the operations it still allows. */
function taskDetail(t){
  var rows=[['Status',t.status],['Ziel-Session',t.assigned_session_id?shortId(t.assigned_session_id):'—'],
    ['Angelegt',stamp(t.created_at)],['Zuletzt',stamp(t.updated_at)]];

  if(t.cost_duration_ms!=null)rows.push(['Dauer',dur(t.cost_duration_ms)]);

  return '<div class="tdet"><div class="prompt">'+esc(t.prompt)+'</div>'+
    '<dl class="dl">'+rows.map(function(r){
      return '<dt>'+esc(r[0])+'</dt><dd class="s">'+esc(r[1])+'</dd>'}).join('')+'</dl>'+
    '<div class="acts">'+
      act('Agent zuteilen','task.assign',t.status!=='queued',
          'nur solange der Lauf queued ist',ctx)+
      act('Fortschritt','task.progress',!open,'nur bei offener Task',ctx)+
      act('Entscheidung','task.decision',false,'',ctx)+
      act('Fertig','task.done',!open,'nur bei offener Task',ctx)+
      act('Blockiert','task.block',!open,'nur bei offener Task',ctx)+
      act('Abbrechen','task.cancel',!open,'nur bei offener Task',ctx)+
      act('Prüfen','task.verify',open,'erst wenn der Lauf terminal ist',ctx)+
    '</div>'+
    '<p class="ch">Der Verlauf dieser Task steht vollständig in <code>task_events</code> — '+
    'es gibt nur keine Query, die ihn zurückgibt. Siehe L5.</p></div>';
}
/* ------------------------------------------------------------------ *
 * The acting half.
 *
 * Every button opens one dialog, and the dialog shows the exact envelope
 * it is about to POST — built from the same object that is sent, never a
 * display copy, so the two cannot drift. Nothing is validated here: the
 * daemon's error corpus already says precisely what is wrong with a
 * payload, and a second copy of those rules in this file is the copy
 * that would go stale.
 * ------------------------------------------------------------------ */

/* A UUIDv7, because `ids.rs` mints v7 and `create::list` orders by
   `created_at, id`: a v4 id sorts arbitrarily inside a timestamp tie, and
   nothing on the daemon side checks the version. `crypto.randomUUID()` is
   v4, so it is deliberately not used. */
function newId(){
  var b=new Uint8Array(16), i;
  if(window.crypto&&window.crypto.getRandomValues)window.crypto.getRandomValues(b);
  else for(i=0;i<16;i++)b[i]=Math.random()*256|0;
  var ms=Date.now();
  b[0]=Math.floor(ms/0x10000000000)&0xff;
  b[1]=Math.floor(ms/0x100000000)&0xff;
  b[2]=Math.floor(ms/0x1000000)&0xff;
  b[3]=Math.floor(ms/0x10000)&0xff;
  b[4]=Math.floor(ms/0x100)&0xff;
  b[5]=ms&0xff;
  b[6]=(b[6]&0x0f)|0x70;   /* version 7 */
  b[8]=(b[8]&0x3f)|0x80;   /* RFC 9562 variant */
  var h='';
  for(i=0;i<16;i++)h+=(b[i]<0x10?'0':'')+b[i].toString(16);
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}

function agentOptions(scopeId){
  return (S.agents[scopeId]||[]).map(function(a){
    return {v:a.name,l:a.name+' · '+a.harness+' · '+a.availability};
  });
}
function sessionOptions(scopeId){
  return S.sessions.filter(function(x){return !scopeId||x.scope_id===scopeId})
    .map(function(x){return {v:x.id,l:shortId(x.id)+' · '+x.agent_name+' · '+x.state}});
}
function scopeOptions(){
  return S.scopes.map(function(s){return {v:s.id,l:s.name}});
}

 'task.block':{k:'c',title:'Auftrag blockieren',

/* ---------- the dialog ---------- */
var DLG=null;

function openCmd(cmd,ctx){
  var spec=CMD[cmd];
  if(!spec)return;
  DLG={spec:spec,cmd:cmd,ctx:ctx||{},vals:{},ids:{},req:newId(),busy:false,err:null,result:null};
  if(spec.mint)DLG.ids[spec.mint]=newId();
  spec.fields(DLG.ctx).forEach(function(f){
    if(f.mint){DLG.ids[f.k]=newId(); return}
    DLG.vals[f.k]=(f.value!=null)?f.value:
      (f.t==='bool'?false:
      (f.t==='select'&&f.options&&f.options.length?f.options[0].v:''));
  });
  paintDialog();
  var d=$('#dlg');
  if(!d.open)d.showModal();
  var first=d.querySelector('[data-f]:not([disabled])');
  if(first)first.focus();
}

/* Only the fields whose `when` matches the current choice. A field that is
   not shown is not sent — that is how the two "exactly one of" forms
   (`task.send`'s agent vs session, `schedule.create`'s new vs existing
   template) stay unambiguous without this file knowing the rule. */
function activeFields(){
  return DLG.spec.fields(DLG.ctx).filter(function(f){
    if(!f.when)return true;
    var key=Object.keys(f.when)[0];
    return DLG.vals[key]===f.when[key];
  });
}

/* The one envelope. What the preview renders and what `submit` posts are
   this same object — there is deliberately no second, prettier copy. */
function envelopeOf(){
  var spec=DLG.spec, e={};
  e.api=(spec.k==='q')?'factory.query/v1':'factory.command/v1';
  e.request_id=DLG.req;
  e.scope_id=DLG.vals.__scope||DLG.ctx.scope_id||S.root;
  if(spec.k==='q')e.query=DLG.cmd; else e.command=DLG.cmd;

  var p={};
  var given=DLG.ctx.payload||{};
  Object.keys(given).forEach(function(k){p[k]=given[k]});
  if(spec.mint)p[spec.mint]=DLG.ids[spec.mint];
  activeFields().forEach(function(f){
    if(f.k.slice(0,2)==='__')return;
    if(f.mint){p[f.k]=DLG.ids[f.k]; return}
    var v=DLG.vals[f.k];
    if(f.t==='bool'){p[f.k]=!!v; return}
    // An empty required field is sent as an empty string rather than
    // omitted, so the daemon answers with its own message about *that*
    // field instead of a generic "missing".
    if(v===''||v==null){ if(f.req)p[f.k]=''; return }
    p[f.k]=v;
  });
  e.payload=p;
  return e;
}

function fieldHtml(f){
  var v=DLG.vals[f.k], id='f_'+f.k;
  var lab='<label class="fl" for="'+id+'">'+esc(f.label)+
    (f.opt?' <span class="opt">optional</span>':'')+'</label>';
  var ctl;
  if(f.mint){
    ctl='<output class="fi ro" id="'+id+'">'+esc(DLG.ids[f.k])+'</output>';
  }else if(f.t==='area'){
    ctl='<textarea class="fi" id="'+id+'" data-f="'+esc(f.k)+'" rows="'+(f.rows||3)+'">'+
      esc(v)+'</textarea>';
  }else if(f.t==='select'){
    var opts=(f.options||[]);
    ctl=opts.length?
      '<select class="fi" id="'+id+'" data-f="'+esc(f.k)+'">'+opts.map(function(o){
        return '<option value="'+esc(o.v)+'"'+(String(o.v)===String(v)?' selected':'')+'>'+
          esc(o.l)+'</option>';
      }).join('')+'</select>':
      '<output class="fi ro empty-sel">nichts zur Auswahl</output>';
  }else if(f.t==='radio'){
    ctl='<div class="fradio">'+(f.options||[]).map(function(o){
      return '<label><input type="radio" name="'+id+'" data-f="'+esc(f.k)+'" value="'+esc(o.v)+'"'+
        (String(o.v)===String(v)?' checked':'')+'> '+esc(o.l)+'</label>';
    }).join('')+'</div>';
  }else if(f.t==='bool'){
    ctl='<label class="fcheck"><input type="checkbox" data-f="'+esc(f.k)+'"'+(v?' checked':'')+
      '> '+esc(f.label)+'</label>';
    lab='';
  }else{
    ctl='<input class="fi" type="text" id="'+id+'" data-f="'+esc(f.k)+'" value="'+esc(v)+'">';
  }
  return '<div class="fr">'+lab+ctl+
    (f.help?'<p class="fh">'+f.help+'</p>':'')+'</div>';
}

function resultHtml(){
  if(!DLG.result)return '';
  var r=DLG.result;
  if(DLG.cmd==='agent.attach_command'){
    var argv=(r.argv||[]).map(function(a){
      return /[\s"'$]/.test(a)?"'"+String(a).replace(/'/g,"'\\''")+"'":a;
    }).join(' ');
    return '<div class="dres"><div class="rt">Im Terminal ausführen</div>'+
      '<pre class="argv">'+esc(argv)+'</pre>'+
      '<p class="fh">Der Leitstand hängt sich nicht selbst an: eine Sitzung gehört in ein Terminal, '+
      'nicht in einen Browser-Tab.</p></div>';
  }
  if(DLG.cmd==='scope.reconcile'){
    var drift=r.drift||[], applied=r.applied||[];
    var rows=function(list){
      return list.map(function(d){
        return '<tr><td class="m">'+esc(d.name||shortId(d.id))+'</td><td class="m">'+
          esc(d.kind)+'</td></tr>';
      }).join('');
    };
    return '<div class="dres"><div class="rt">'+
      (r.clean?'Keine Abweichung':drift.length+' Abweichung'+(drift.length===1?'':'en'))+'</div>'+
      (drift.length?'<table class="t"><thead><tr><th>Scope</th><th>Art</th></tr></thead><tbody>'+
        rows(drift)+'</tbody></table>':'')+
      (applied.length?'<p class="fh"><b>'+applied.length+' behoben.</b></p>':
        (drift.length?'<p class="fh">Nur berichtet — nichts geändert.</p>':''))+
    '</div>';
  }
  return '<div class="dres"><div class="rt">Angenommen</div><pre class="argv">'+
    esc(JSON.stringify(r,null,2))+'</pre></div>';
}

function paintDialog(){
  var spec=DLG.spec;
  var fields=activeFields().map(fieldHtml).join('');
  var env=envelopeOf();
  var err=DLG.err?'<div class="derr"><b>'+esc(DLG.err.code)+'</b>'+
    '<p>'+esc(DLG.err.message)+'</p></div>':'';
  $('#dlg').innerHTML=
   '<form method="dialog" class="dwrap">'+
    '<div class="dhead"><h3>'+esc(spec.title)+'</h3><span class="q w">'+esc(DLG.cmd)+'</span>'+
      '<button class="dx" value="cancel" aria-label="Schließen">✕</button></div>'+
    '<p class="dlede">'+spec.lede+'</p>'+
    (fields?'<div class="dfields">'+fields+'</div>':'')+
    err+resultHtml()+
    '<div class="dprev"><div class="pt">Das geht an <code>POST /api</code></div>'+
      '<pre>'+esc(JSON.stringify(env,null,2))+'</pre></div>'+
    '<div class="dacts">'+
      '<button class="act" value="cancel">'+(DLG.result?'Schließen':'Abbrechen')+'</button>'+
      (DLG.result&&spec.keep?'':
        '<button class="act go'+(spec.danger?' danger':'')+'" id="dgo" type="button"'+
        (DLG.busy?' disabled':'')+'>'+(DLG.busy?'sendet …':'Senden')+'</button>')+
    '</div>'+
   '</form>';
}

function submit(){
  if(DLG.busy)return;
  DLG.busy=true; DLG.err=null; paintDialog();
  var env=envelopeOf();
  fetch('/api',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(env)
  }).then(function(r){return r.json()}).then(function(j){
    DLG.busy=false;
    if(j.api==='factory.error/v1'){DLG.err=j.error; paintDialog(); return}
    DLG.result=j.result;
    $('#lastcall').textContent='→ '+DLG.cmd;
    if(DLG.spec.keep)paintDialog(); else $('#dlg').close();
    poll();
  }).catch(function(e){
    DLG.busy=false;
    DLG.err={code:'transport',message:e.message};
    paintDialog();
  });
}

document.addEventListener('input',function(e){
  var el=e.target.closest('[data-f]');
  if(!el||!DLG||!$('#dlg').open)return;
  DLG.vals[el.getAttribute('data-f')]=(el.type==='checkbox')?el.checked:el.value;
  // Repaint only the preview while typing; repainting the fields would move
  // the caret. A radio or checkbox changes which fields apply, so it gets
  // the full repaint through the `change` listener below.
  var prev=$('#dlg .dprev pre');
  if(prev)prev.textContent=JSON.stringify(envelopeOf(),null,2);
});
document.addEventListener('change',function(e){
  var el=e.target.closest('[data-f]');
  if(!el||!DLG||!$('#dlg').open)return;
  if(el.type!=='radio'&&el.type!=='checkbox'&&el.tagName!=='SELECT')return;
  DLG.vals[el.getAttribute('data-f')]=(el.type==='checkbox')?el.checked:el.value;
  paintDialog();
});
document.addEventListener('click',function(e){
  if(e.target&&e.target.id==='dgo')submit();
});

/* ---------- router ---------- */
/* The address bar carries the scope, not the level: every level is on the
   page at once, so there is nothing else to route. */
function render(){
  renderTabs();
  renderTree();
  $('#main').innerHTML=(selScope==='*')?viewMatrix():viewScope();
  $('#lastcall').textContent='daemon.status + scope.list + agent.list + agent.status + '+
    'task.list + schedule.list';
}

function poll(){
  if(inflight)return;
  inflight=true;
  load().then(function(n){
    inflight=false;
    if(!booted){booted=true; fromHash()}
    alarm(null);
    wire(n,true);
    render();
  }).catch(function(e){
    inflight=false;
    wire(null,false);
    alarm('<b>Der Daemon antwortet nicht:</b> '+esc(e.message)+
      (e.code?' <code>'+esc(e.code)+'</code>':'')+
      ' — die Seite zeigt weiter den letzten Stand. Läuft <code>factory start</code>?');
    if(S.loaded)render();
  });
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-go],[data-scope],[data-task],[data-cmd],[data-pview]');
  if(!b)return;
  if(b.hasAttribute('data-cmd')){
    if(b.disabled)return;
    var raw=b.getAttribute('data-ctx');
    var ctx={};
    if(raw){try{ctx=JSON.parse(raw)}catch(err){ctx={}}}
    openCmd(b.getAttribute('data-cmd'),ctx);
    return;
  }
  if(b.hasAttribute('data-pview')){procView=b.getAttribute('data-pview'); render(); return}
  if(b.hasAttribute('data-go')){cur=b.getAttribute('data-go'); writeHash(); render(); window.scrollTo(0,0); return}
  if(b.hasAttribute('data-scope')){
    selScope=b.getAttribute('data-scope');
    writeHash(); render(); window.scrollTo(0,0); return;
  }
  if(b.hasAttribute('data-task')){selTask=b.getAttribute('data-task'); render(); return}
});

/* `#<scope>/<level>` — both halves, so a bookmark comes back to the same
   page and not merely to the same scope. */
function writeHash(){
  var sc=scopeById(selScope);
  var h=((selScope==='*')?'alle':(sc?sc.name:''))+'/'+cur;
  if(h.charAt(0)!=='/'&&window.location.hash!=='#'+h)window.location.hash=h;
}
function fromHash(){
  var raw=decodeURIComponent(String(window.location.hash||'').replace(/^#/,''));
  if(!raw)return;
  var parts=raw.split('/'), name=parts[0], level=parts[1];
  if(level&&lv(level))cur=level;
  if(name==='alle'){selScope='*'; return}
  for(var i=0;i<S.scopes.length;i++)if(S.scopes[i].name===name){selScope=S.scopes[i].id; return}
}
window.addEventListener('hashchange',function(){fromHash(); render(); });

$('#main').innerHTML='<div class="empty"><b>Verbinde mit dem Daemon …</b></div>';
poll();
timer=window.setInterval(poll,POLL_MS);
})();
