# An example scope policy (#390): what one scope -- here a project that
# ships software -- commits to under the CRA, at
# `<scope>/.factory/policies/cra.yaml`. It applies to that scope only;
# nothing is inherited down the tree, and a parent scope shows it in its
# aggregate. (Saved at the instance root, `<root>/.factory/policies/`, it is
# the root scope's own policy.)
#
# `template: cra` picks controls from `templates/cra.yaml` by id: each one
# inherits its title, kind, `maps_to` and remediation from there, and this
# file names only this scope's own evidence -- its tasks, workflows,
# metrics, datasets. A template control left out is listed as "not
# selected" (never counted); one that does not apply here is marked
# `not_applicable` with a rationale.
framework: cra
template: cra
controls:
  - id: annex-i-2-1
    remediation: |
      Add the `sbom-export` task (weekly) that runs
      `examples/factory-dependency-scan.sh built` and attaches its SBOM.
    evidence:
      - check: knowledge
      - check: task
        task: sbom-export
        max_age: 30d

  - id: annex-i-2-2
    evidence:
      - check: knowledge
      - check: attestation

  - id: annex-i-2-3
    evidence:
      - check: dependencies
        sbom_max_age: 30d
        max_open: { critical: 0, high: 0 }
        exploited_open: 0
      - check: task
        task: vuln-scan
        max_age: 7d

  - id: annex-i-2-4
    evidence:
      - check: attestation

  - id: annex-i-2-5
    evidence:
      - check: knowledge

  - id: annex-i-1-2-d
    evidence:
      - check: roles
        forbid: [policy.attest]
      - check: sandbox

  - id: art-14
    evidence:
      - check: attestation

  - id: annex-i-1-2-l
    not_applicable: "The product keeps no security log of its own; the host's is out of scope"
