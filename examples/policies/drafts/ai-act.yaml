# A DRAFT policy for the EU AI Act (#390) -- what a scope would commit to if
# it adopted the `ai-act` template, kept in `policies/drafts/` so it never
# affects the real compliance report. No loader reads `drafts/` as a policy;
# only a scenario's `policy.add_frameworks: [ai-act]` resolves it, per
# scope, as a what-if -- see `examples/scenarios/ai-act-2027.yaml`.
framework: ai-act
template: ai-act
controls:
  - id: art-9
    evidence:
      - check: knowledge
      - check: attestation

  - id: art-10
    evidence:
      - check: knowledge

  - id: art-11
    evidence:
      - check: task
        task: ai-act-doc-refresh
        max_age: 90d

  - id: art-12
    evidence:
      - check: attestation

  - id: art-14
    evidence:
      - check: knowledge
      - check: attestation
