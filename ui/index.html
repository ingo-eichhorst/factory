<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #fff; --line: #e6e2dc; --ink: #1c1b19;
    --dim: #6d6862; --accent: #9a3f1f; --ok: #2f6b3a; --bad: #a32626;
    --warn: #8a6d1f; --code: #f2efea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614; --panel: #201e1b; --line: #35312c; --ink: #ece8e1;
      --dim: #9a948b; --accent: #e08256; --ok: #7cc088; --bad: #e28080;
      --warn: #d6b55c; --code: #2a2723;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 18px 24px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { margin: 0; font-size: 17px; letter-spacing: .02em; }
  header .meta { color: var(--dim); font-size: 13px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 6px; }
  .dot.live { background: var(--ok); }
  main { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; padding: 20px 24px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  section > h2 { margin: 0; padding: 12px 16px; font-size: 13px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--dim); border-bottom: 1px solid var(--line); font-weight: 600; }
  .body { padding: 14px 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  tr:last-child td { border-bottom: 0; }
  tr.task { cursor: pointer; }
  tr.task:hover { background: var(--code); }
  tr.task.sel { background: var(--code); box-shadow: inset 3px 0 0 var(--accent); }
  .title { font-weight: 500; }
  .sub { color: var(--dim); font-size: 12px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11.5px;
    font-weight: 600; text-transform: uppercase; letter-spacing: .04em; border: 1px solid var(--line); }
  .s-pending { color: var(--dim); }
  .s-dispatching, .s-running { color: var(--warn); border-color: var(--warn); }
  .s-blocked { color: var(--accent); border-color: var(--accent); }
  .s-done { color: var(--ok); border-color: var(--ok); }
  .s-failed, .s-cancelled { color: var(--bad); border-color: var(--bad); }
  label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; font-weight: 600; }
  input, textarea, select, button {
    font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%;
  }
  textarea { min-height: 74px; resize: vertical; }
  button { width: auto; cursor: pointer; background: var(--panel); }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { opacity: .9; color: #fff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  pre { background: var(--code); padding: 10px 12px; border-radius: 6px; overflow-x: auto;
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; }
  .journal { max-height: 320px; overflow-y: auto; }
  .entry { border-bottom: 1px solid var(--line); padding: 8px 0; font-size: 13px; }
  .entry:last-child { border-bottom: 0; }
  .entry .when { color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .entry .who { font-weight: 600; }
  .empty { color: var(--dim); padding: 18px 16px; font-style: italic; }
  .err { color: var(--bad); font-size: 13px; margin-top: 8px; min-height: 1.4em; }
  code.id { font: 12px ui-monospace, Menlo, monospace; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Factory</h1>
  <span class="meta" id="instance">—</span>
  <span class="meta" style="margin-left:auto"><span class="dot" id="dot"></span><span id="conn">connecting</span></span>
</header>

<main>
  <section>
    <h2>Tasks</h2>
    <table>
      <thead><tr><th style="width:45%">Task</th><th>Status</th><th>Scope</th><th>Agent</th></tr></thead>
      <tbody id="tasks"></tbody>
    </table>
    <div class="empty" id="noTasks" hidden>Nothing here yet. Create a task on the right.</div>
  </section>

  <div style="display:grid; gap:20px">
    <section>
      <h2>New task</h2>
      <div class="body">
        <label for="f-title">Title</label>
        <input id="f-title" placeholder="What should happen">
        <label for="f-instructions">Instructions</label>
        <textarea id="f-instructions" placeholder="What the agent is being asked to do"></textarea>
        <div class="grid2">
          <div><label for="f-scope">Scope</label><select id="f-scope"></select></div>
          <div><label for="f-agent">Agent</label><select id="f-agent"></select></div>
        </div>
        <label for="f-schedule">Schedule <span style="font-weight:400">(blank = manual)</span></label>
        <input id="f-schedule" placeholder="every 300  ·  cron 0 9 * * 1">
        <div class="row">
          <button class="primary" id="create">Create</button>
          <button id="createRun">Create and run</button>
        </div>
        <div class="err" id="formErr"></div>
      </div>
    </section>

    <section id="detail" hidden>
      <h2>Detail</h2>
      <div class="body">
        <div class="title" id="d-title"></div>
        <div class="sub"><code class="id" id="d-id"></code></div>
        <div class="row">
          <button id="d-run">Run</button>
          <button id="d-cancel">Cancel</button>
          <button id="d-output">Terminal</button>
          <button id="d-delete">Delete</button>
        </div>
        <div class="err" id="d-err"></div>
        <div id="d-outcome"></div>
        <label>Journal</label>
        <div class="journal" id="d-journal"></div>
        <div id="d-term" hidden><label>Terminal</label><pre id="d-termtext"></pre></div>
      </div>
    </section>
  </div>
</main>

<script>
const tasks = new Map();
let selected = null;
let scopes = [];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, opts) {
  const res = await fetch(path, {
    headers: { "content-type": "application/json" },
    ...opts,
  });
  const body = await res.json().catch(() => null);
  if (!body) throw new Error(`${res.status} ${res.statusText}`);
  if (body.status === "error") throw new Error(body.message);
  return body.data;
}

function statusBadge(s) {
  return `<span class="badge s-${esc(s)}">${esc(s)}</span>`;
}

function renderTasks() {
  const rows = [...tasks.values()].sort((a, b) => b.created_at.localeCompare(a.created_at));
  $("noTasks").hidden = rows.length > 0;
  $("tasks").innerHTML = rows.map(t => `
    <tr class="task ${t.id === selected ? "sel" : ""}" data-id="${esc(t.id)}">
      <td><div class="title">${esc(t.title)}</div>
          <div class="sub">${t.schedule ? esc(scheduleLabel(t.schedule)) : "manual"}</div></td>
      <td>${statusBadge(t.status)}</td>
      <td class="sub">${esc(t.scope)}</td>
      <td class="sub">${esc(t.agent)}</td>
    </tr>`).join("");
  for (const tr of $("tasks").querySelectorAll("tr.task")) {
    tr.onclick = () => select(tr.dataset.id);
  }
  if (selected && tasks.has(selected)) renderDetail(tasks.get(selected));
}

function scheduleLabel(s) {
  if (!s) return "manual";
  if (s.cron) return `cron ${s.cron}`;
  if (s.every) return `every ${s.every.seconds}s`;
  return JSON.stringify(s);
}

function renderDetail(t) {
  $("detail").hidden = false;
  $("d-title").textContent = t.title;
  $("d-id").textContent = t.id;
  const terminal = ["done", "failed", "cancelled"].includes(t.status);
  $("d-run").disabled = !(t.status === "pending" || terminal);
  $("d-cancel").disabled = terminal;
  $("d-output").disabled = !t.session;
  let outcome = "";
  if (t.result) outcome += `<label>Result</label><pre>${esc(t.result)}</pre>`;
  if (t.error) outcome += `<label>Error</label><pre>${esc(t.error)}</pre>`;
  if (t.instructions) outcome += `<label>Instructions</label><pre>${esc(t.instructions)}</pre>`;
  $("d-outcome").innerHTML = outcome;
}

async function select(id) {
  selected = id;
  renderTasks();
  $("d-err").textContent = "";
  $("d-term").hidden = true;
  await loadJournal(id);
}

async function loadJournal(id) {
  try {
    const data = await api(`/api/tasks/${id}/entries?limit=200`);
    const entries = data.entries || [];
    $("d-journal").innerHTML = entries.length ? entries.slice().reverse().map(e => `
      <div class="entry">
        <div class="when">${esc(new Date(e.at).toLocaleTimeString())} · <span class="who">${esc(e.source)}</span> · ${esc(e.kind)}</div>
        <div>${esc(e.message)}</div>
      </div>`).join("") : `<div class="sub">No entries yet.</div>`;
  } catch (e) {
    $("d-journal").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

function applyEvent(ev) {
  if (ev.type === "task_created" || ev.type === "task_updated") {
    tasks.set(ev.task.id, ev.task);
    renderTasks();
  } else if (ev.type === "task_deleted") {
    tasks.delete(ev.id);
    if (selected === ev.id) { selected = null; $("detail").hidden = true; }
    renderTasks();
  } else if (ev.type === "task_entry") {
    if (ev.id === selected) loadJournal(selected);
  }
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onopen = () => { $("dot").classList.add("live"); $("conn").textContent = "live"; };
  ws.onclose = () => {
    $("dot").classList.remove("live"); $("conn").textContent = "reconnecting";
    setTimeout(connect, 1500);
  };
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.status !== "ok") return;
    const d = msg.data;
    if (d.kind === "tasks") {
      tasks.clear();
      for (const t of d.tasks) tasks.set(t.id, t);
      renderTasks();
    } else if (d.kind === "event") {
      applyEvent(d.event);
    }
  };
}

function parseSchedule(text) {
  const v = text.trim();
  if (!v) return null;
  const every = v.match(/^every\s+(\d+)\s*(s|sec|secs|seconds|m|min|mins|minutes|h|hours?)?$/i);
  if (every) {
    const n = parseInt(every[1], 10);
    const unit = (every[2] || "s").toLowerCase();
    const mult = unit.startsWith("h") ? 3600 : unit.startsWith("m") && unit !== "s" ? 60 : 1;
    return { every: { seconds: n * mult } };
  }
  return { cron: v.replace(/^cron\s+/i, "") };
}

async function createTask(andRun) {
  $("formErr").textContent = "";
  try {
    const body = {
      title: $("f-title").value.trim(),
      instructions: $("f-instructions").value,
      scope: $("f-scope").value || null,
      agent: $("f-agent").value || null,
      schedule: parseSchedule($("f-schedule").value),
    };
    const data = await api("/api/tasks", { method: "POST", body: JSON.stringify(body) });
    const task = data.task;
    tasks.set(task.id, task);
    $("f-title").value = ""; $("f-instructions").value = ""; $("f-schedule").value = "";
    renderTasks();
    if (andRun) await api(`/api/tasks/${task.id}/run`, { method: "POST" });
    select(task.id);
  } catch (e) {
    $("formErr").textContent = e.message;
  }
}

async function act(path, method = "POST") {
  $("d-err").textContent = "";
  try { await api(path, { method }); }
  catch (e) { $("d-err").textContent = e.message; }
}

async function boot() {
  try {
    const info = (await api("/api/status")).status;
    $("instance").textContent = `${info.instance} · ${info.root}`;
    scopes = info.scopes || [];
  } catch (e) { $("instance").textContent = e.message; }

  try {
    const list = (await api("/api/adapters")).adapters;
    const agents = list.filter(a => a.kind === "agent");
    $("f-agent").innerHTML = `<option value="">(scope default)</option>` +
      agents.map(a => `<option value="${esc(a.name)}">${esc(a.name)}</option>`).join("");
  } catch { /* the select stays as the default */ }

  try {
    const data = await api("/api/tasks");
    for (const t of data.tasks) tasks.set(t.id, t);
    // A scope an existing task uses but the config no longer declares is still
    // worth offering; it is where that task's history lives.
    scopes = [...new Set([...scopes, ...data.tasks.map(t => t.scope)])];
    renderTasks();
  } catch { /* the websocket snapshot will fill it in */ }

  $("f-scope").innerHTML = `<option value="">(first scope)</option>` +
    scopes.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");

  $("create").onclick = () => createTask(false);
  $("createRun").onclick = () => createTask(true);
  $("d-run").onclick = () => act(`/api/tasks/${selected}/run`);
  $("d-cancel").onclick = () => act(`/api/tasks/${selected}/cancel`);
  $("d-delete").onclick = () => act(`/api/tasks/${selected}`, "DELETE");
  $("d-output").onclick = async () => {
    $("d-err").textContent = "";
    try {
      const data = await api(`/api/tasks/${selected}/output?lines=200`);
      $("d-term").hidden = false;
      $("d-termtext").textContent = data.text;
    } catch (e) { $("d-err").textContent = e.message; }
  };

  connect();
}

boot();
</script>
</body>
</html>
