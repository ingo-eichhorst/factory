<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #fff; --line: #e6e2dc; --ink: #1c1b19;
    --dim: #6d6862; --accent: #9a3f1f; --ok: #2f6b3a; --bad: #a32626;
    --warn: #8a6d1f; --code: #f2efea; --shadow: 0 12px 40px rgba(28,27,25,.18);
    --term-bg: #1c1b19; --term-ink: #e8e3da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614; --panel: #201e1b; --line: #35312c; --ink: #ece8e1;
      --dim: #9a948b; --accent: #e08256; --ok: #7cc088; --bad: #e28080;
      --warn: #d6b55c; --code: #2a2723; --shadow: 0 12px 40px rgba(0,0,0,.5);
      --term-bg: #121110; --term-ink: #ddd7cd;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { margin: 0; font-size: 17px; letter-spacing: .02em; }
  .meta { color: var(--dim); font-size: 13px; }
  .tabs { display: flex; gap: 4px; }
  .tabs button {
    border: 1px solid transparent; background: none; color: var(--dim);
    padding: 5px 13px; border-radius: 7px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button.on { background: var(--code); color: var(--ink); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 6px; }
  .dot.live { background: var(--ok); }
  main { padding: 20px 24px 60px; max-width: 1180px; margin: 0 auto; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .bar h2 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 600; }
  .bar .sp { margin-left: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  tr:last-child td { border-bottom: 0; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: var(--code); }
  .title { font-weight: 500; }
  .sub { color: var(--dim); font-size: 12px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11.5px;
    font-weight: 600; text-transform: uppercase; letter-spacing: .04em; border: 1px solid var(--line); white-space: nowrap; }
  .s-pending { color: var(--dim); }
  .s-dispatching, .s-running { color: var(--warn); border-color: var(--warn); }
  .s-blocked { color: var(--accent); border-color: var(--accent); }
  .s-done { color: var(--ok); border-color: var(--ok); }
  .s-failed, .s-cancelled { color: var(--bad); border-color: var(--bad); }
  label { display: block; font-size: 12px; color: var(--dim); margin: 12px 0 4px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .05em; }
  input, textarea, select {
    font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%;
  }
  textarea { min-height: 84px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  button.btn {
    font: inherit; color: inherit; background: var(--panel); cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 13px;
  }
  button.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.btn:disabled { opacity: .4; cursor: default; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.primary:hover:not(:disabled) { opacity: .9; color: #fff; }
  button.btn.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  pre { background: var(--code); padding: 10px 12px; border-radius: 6px; overflow-x: auto;
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; white-space: pre-wrap; }
  .empty { color: var(--dim); padding: 22px 16px; font-style: italic; }
  .err { color: var(--bad); font-size: 13px; margin-top: 8px; }
  code.id { font: 12px ui-monospace, Menlo, monospace; color: var(--dim); }

  /* agents, grouped by scope */
  .agents { display: grid; gap: 18px; }
  .scope { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .scope > .head { padding: 13px 16px; border-bottom: 1px solid var(--line); display: flex;
    align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .scope > .head h3 { margin: 0; font-size: 15px; }
  .agent { padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .agent:last-child { border-bottom: 0; }
  .agent .line { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .agent .nm { font-weight: 600; }
  .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim);
    border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; font-weight: 600; }
  .tag.plug { color: var(--accent); border-color: var(--accent); }
  .tag.perm { color: var(--ok); border-color: var(--ok); }
  .tag.foreman { color: var(--accent); border-color: var(--accent); }
  .attach { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .attach code { background: var(--code); padding: 3px 8px; border-radius: 5px;
    font: 12px ui-monospace, Menlo, monospace; }
  .work { margin-top: 9px; display: grid; gap: 7px; }
  .work .job { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; cursor: pointer; }
  .work .job:hover .jt { color: var(--accent); }
  .jt { font-weight: 500; }
  .idle { color: var(--dim); font-size: 13px; font-style: italic; }

  /* terminal input */
  .terminput { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .terminput input { flex: 1 1 220px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .keys { display: flex; gap: 5px; }
  .keys button { font: 12px ui-monospace, Menlo, monospace; padding: 5px 9px; }

  /* modal */
  .scrim { position: fixed; inset: 0; background: rgba(20,19,17,.5); z-index: 20;
    display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); width: min(900px, 100%); }
  .modal > header { position: static; border-radius: 12px 12px 0 0; align-items: flex-start; }
  .modal h2 { margin: 0 0 2px; font-size: 17px; }
  .x { margin-left: auto; background: none; border: 0; color: var(--dim); font-size: 22px;
    line-height: 1; cursor: pointer; padding: 0 4px; }
  .x:hover { color: var(--ink); }
  .modal .body { padding: 16px 24px 24px; }
  .runs { display: flex; gap: 8px; flex-wrap: wrap; }
  .runs button {
    font: inherit; cursor: pointer; background: var(--bg); color: inherit;
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px; text-align: left; font-size: 13px;
  }
  .runs button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .runs button .sub { display: block; }
  .journal { max-height: 220px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; padding: 0 12px; }
  .entry { border-bottom: 1px solid var(--line); padding: 8px 0; font-size: 13px; }
  .entry:last-child { border-bottom: 0; }
  .entry .when { color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .entry .who { font-weight: 600; }
  .term {
    background: var(--term-bg); color: var(--term-ink); border-radius: 6px; padding: 12px 14px;
    font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    height: 300px; overflow: auto; white-space: pre; margin: 0;
  }
  .term.idle { color: #8b857b; font-style: italic; white-space: pre-wrap; }
  .live-tag { color: var(--warn); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
</style>
</head>
<body>
<header>
  <h1>Factory</h1>
  <span class="meta" id="instance">—</span>
  <nav class="tabs">
    <button id="tab-tasks" class="on">Tasks</button>
    <button id="tab-agents">Agents</button>
  </nav>
  <span class="meta" style="margin-left:auto"><span class="dot" id="dot"></span><span id="conn">connecting</span></span>
</header>

<main>
  <div id="view-tasks">
    <div class="bar">
      <h2>Tasks</h2>
      <span class="sp"></span>
      <button class="btn primary" id="newTask">New task</button>
    </div>
    <section>
      <table>
        <thead><tr><th style="width:42%">Task</th><th>Status</th><th>Runs</th><th>Scope</th><th>Agent</th></tr></thead>
        <tbody id="tasks"></tbody>
      </table>
      <div class="empty" id="noTasks" hidden>Nothing here yet.</div>
    </section>
  </div>

  <div id="view-agents" hidden>
    <div class="bar"><h2>Agents</h2></div>
    <div class="agents" id="agents"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TERMINAL = ["done", "failed", "cancelled"];

const state = {
  tab: "tasks",
  tasks: new Map(),
  scopes: [],          // the agents page: scopes, each with its agents
  adapters: [],        // every agent adapter name, for the create form
  scopeNames: [],
  open: null,          // task id shown in the modal
  runs: [],            // runs of the open task
  run: null,           // selected run id
  term: null,          // {kind:'run'|'agent', id} the terminal is showing
  poll: null,          // terminal poll timer
  agentPoll: null,
};

// ---------------------------------------------------------------- transport

async function api(path, opts) {
  const res = await fetch(path, { headers: { "content-type": "application/json" }, ...opts });
  const body = await res.json().catch(() => null);
  if (!body) throw new Error(`${res.status} ${res.statusText}`);
  if (body.status === "error") throw new Error(body.message);
  return body.data;
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onopen = () => { $("dot").classList.add("live"); $("conn").textContent = "live"; };
  ws.onclose = () => {
    $("dot").classList.remove("live"); $("conn").textContent = "reconnecting";
    setTimeout(connect, 1500);
  };
  ws.onmessage = (m) => {
    let msg; try { msg = JSON.parse(m.data); } catch { return; }
    if (msg.status !== "ok") return;
    const d = msg.data;
    if (d.kind === "tasks") {
      state.tasks = new Map(d.tasks.map(t => [t.id, t]));
      renderTasks();
    } else if (d.kind === "event") {
      onEvent(d.event);
    }
  };
}

function onEvent(ev) {
  switch (ev.type) {
    case "task_created":
    case "task_updated":
      state.tasks.set(ev.task.id, ev.task);
      renderTasks();
      if (state.open === ev.task.id) renderModal();
      break;
    case "task_deleted":
      state.tasks.delete(ev.id);
      renderTasks();
      if (state.open === ev.id) closeModal();
      break;
    case "task_entry":
      if (state.open === ev.id) loadJournal();
      break;
    case "run_started":
    case "run_updated":
      if (state.open === ev.run.task_id) {
        const i = state.runs.findIndex(r => r.id === ev.run.id);
        if (i >= 0) state.runs[i] = ev.run; else state.runs.unshift(ev.run);
        // A new run is the one worth watching.
        if (ev.type === "run_started") state.run = ev.run.id;
        renderModal();
        retimeTerminal();
      }
      break;
  }
  // The agents page is a view over runs and standing agents alike.
  if (state.tab === "agents" && (ev.type.startsWith("run_") || ev.type.startsWith("agent_"))) {
    loadAgents();
  }
}

// ------------------------------------------------------------------- tasks

function statusBadge(s) { return `<span class="badge s-${esc(s)}">${esc(s)}</span>`; }

function scheduleLabel(s) {
  if (!s) return "manual";
  if (s.cron) return `cron ${s.cron}`;
  if (s.every) return `every ${s.every.seconds}s`;
  return "scheduled";
}

function renderTasks() {
  const rows = [...state.tasks.values()].sort((a, b) => b.created_at.localeCompare(a.created_at));
  $("noTasks").hidden = rows.length > 0;
  $("tasks").innerHTML = rows.map(t => `
    <tr class="row" data-id="${esc(t.id)}">
      <td><div class="title">${esc(t.title)}</div>
          <div class="sub">${esc(scheduleLabel(t.schedule))}</div></td>
      <td>${statusBadge(t.status)}</td>
      <td class="sub">${t.runs || 0}</td>
      <td class="sub">${esc(t.scope)}</td>
      <td class="sub">${esc(t.agent)}</td>
    </tr>`).join("");
  for (const tr of $("tasks").querySelectorAll("tr.row")) {
    tr.onclick = () => openTask(tr.dataset.id);
  }
}

// ------------------------------------------------------------------ agents

async function loadAgents() {
  try {
    state.scopes = (await api("/api/agents")).scopes;
    if (state.scopes.length) state.adapters = state.scopes[0].available;
    renderAgents();
  } catch (e) {
    $("agents").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

function since(iso) {
  const secs = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  if (secs < 90) return `${secs}s`;
  if (secs < 5400) return `${Math.round(secs / 60)}m`;
  return `${Math.round(secs / 3600)}h`;
}

function agentTags(a) {
  const tags = [];
  if (a.role === "foreman") tags.push(`<span class="tag foreman">foreman</span>`);
  if (a.lifetime === "permanent") tags.push(`<span class="tag perm">permanent</span>`);
  else if (a.lifetime === "temporary") tags.push(`<span class="tag">temporary</span>`);
  if (a.is_default) tags.push(`<span class="tag">default</span>`);
  if (a.source && a.source !== "builtin" && a.source !== "missing") tags.push(`<span class="tag plug">plugin</span>`);
  if (!a.declared) tags.push(`<span class="tag">undeclared</span>`);
  return tags.join(" ");
}

function renderAgents() {
  $("agents").innerHTML = state.scopes.map(s => {
    const rows = s.agents.map(a => {
      const standing = a.lifetime !== "task";
      const live = a.state === "ready" || a.state === "starting";
      const buttons = [];
      if (standing) {
        buttons.push(`<button class="btn" data-act="start" data-scope="${esc(s.name)}" data-name="${esc(a.name)}" ${live ? "disabled" : ""}>Start</button>`);
        buttons.push(`<button class="btn" data-act="stop" data-id="${esc(a.id || "")}" ${live ? "" : "disabled"}>Stop</button>`);
        buttons.push(`<button class="btn" data-act="term" data-id="${esc(a.id || "")}" ${live ? "" : "disabled"}>Terminal</button>`);
      }
      buttons.push(`<button class="btn" data-act="task" data-scope="${esc(s.name)}" data-agent="${esc(a.adapter)}">Start task…</button>`);

      const attach = a.attach
        ? `<div class="attach"><span class="sub">attach</span><code>${esc(a.attach)}</code>
             <button class="btn" data-act="copy" data-copy="${esc(a.attach)}">Copy</button></div>`
        : (a.session ? `<div class="attach"><span class="sub">session</span><code>${esc(a.session)}</code></div>` : "");

      const work = a.active.length
        ? `<div class="work">${a.active.map(w => `
            <div class="job" data-task="${esc(w.task_id)}" data-run="${esc(w.run_id)}">
              ${statusBadge(w.status)} <span class="jt">${esc(w.task_title)}</span>
              <span class="sub">attempt ${w.attempt} · ${esc(w.trigger)} · ${esc(w.runtime)}${w.session ? " " + esc(w.session) : ""} · ${since(w.started_at)}</span>
            </div>`).join("")}</div>`
        : (standing && live
            ? `<div class="work idle">up and waiting${a.started_at ? " · " + since(a.started_at) : ""}</div>`
            : `<div class="work idle">nothing running</div>`);

      return `<div class="agent">
        <div class="line">
          <span class="nm">${esc(a.name)}</span>
          ${a.adapter !== a.name ? `<span class="sub">${esc(a.adapter)}</span>` : ""}
          ${standing ? statusBadge(a.state) : ""}
          ${agentTags(a)}
          <span style="margin-left:auto"></span>
          <span class="row-btns">${buttons.join("")}</span>
        </div>
        <div class="sub">${esc(a.description)}</div>
        ${a.error ? `<div class="err">${esc(a.error)}</div>` : ""}
        ${attach}
        ${work}
      </div>`;
    }).join("");

    return `<div class="scope">
      <div class="head">
        <h3>${esc(s.name)}</h3>
        <span class="sub">${esc(s.path)}</span>
        <span style="margin-left:auto"></span>
        <span class="sub">tasks default to ${esc(s.default_agent)} on ${esc(s.runtime)}</span>
      </div>
      ${rows || `<div class="empty">No agents declared.</div>`}
    </div>`;
  }).join("") || `<div class="empty">This instance declares no scopes.</div>`;

  for (const el of $("agents").querySelectorAll("[data-act]")) {
    el.onclick = (e) => { e.stopPropagation(); agentAction(el); };
  }
  for (const job of $("agents").querySelectorAll(".job")) {
    job.onclick = () => openTask(job.dataset.task, job.dataset.run);
  }
}

async function agentAction(el) {
  const act = el.dataset.act;
  try {
    if (act === "start") {
      el.disabled = true;
      await api("/api/agents/start", { method: "POST", body: JSON.stringify({ scope: el.dataset.scope, name: el.dataset.name }) });
    } else if (act === "stop") {
      el.disabled = true;
      await api("/api/agents/stop", { method: "POST", body: JSON.stringify({ id: el.dataset.id }) });
    } else if (act === "term") {
      return openAgent(el.dataset.id);
    } else if (act === "task") {
      return openCreate({ scope: el.dataset.scope, agent: el.dataset.agent });
    } else if (act === "copy") {
      await navigator.clipboard.writeText(el.dataset.copy).catch(() => {});
      const was = el.textContent; el.textContent = "Copied"; setTimeout(() => { el.textContent = was; }, 1200);
      return;
    }
  } catch (e) {
    alert(e.message);
  }
  loadAgents();
}

// ------------------------------------------------------------------- modal

function scrim(inner) {
  const el = document.createElement("div");
  el.className = "scrim";
  el.innerHTML = `<div class="modal">${inner}</div>`;
  el.onclick = (e) => { if (e.target === el) closeModal(); };
  document.body.appendChild(el);
  return el;
}

function closeModal() {
  for (const el of document.querySelectorAll(".scrim")) el.remove();
  state.open = null; state.runs = []; state.run = null;
  stopTerminal();
  state.term = null;
}

document.addEventListener("keydown", (e) => {
  // Escape closes the modal -- unless the terminal input has focus, where it is
  // a key the agent is waiting for.
  if (e.key !== "Escape") return;
  if (document.activeElement && document.activeElement.id === "t-input") return;
  closeModal();
});

/// The terminal plus the row that types into it. Same markup for a task run and
/// for a standing agent; only the target differs.
function terminalBlock(label) {
  return `
    <label>${label} <span class="live-tag" id="t-live" hidden>live</span></label>
    <pre class="term" id="t-term">connecting…</pre>
    <div class="terminput">
      <input id="t-input" placeholder="type here, Enter sends" autocomplete="off">
      <span class="keys">
        <button class="btn" data-key="enter">⏎</button>
        <button class="btn" data-key="esc">esc</button>
        <button class="btn" data-key="up">↑</button>
        <button class="btn" data-key="down">↓</button>
        <button class="btn" data-key="ctrl-c">^C</button>
      </span>
    </div>
    <div class="err" id="t-err"></div>`;
}

function wireTerminal() {
  const input = $("t-input");
  if (!input) return;
  input.onkeydown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); sendInput(input.value, ["enter"]); input.value = ""; }
  };
  for (const b of document.querySelectorAll("[data-key]")) {
    b.onclick = () => sendInput("", [b.dataset.key]);
  }
}

async function openTask(id, runId) {
  closeModal();
  state.open = id;
  state.run = runId || null;
  scrim(`
    <header>
      <div><h2 id="m-title">…</h2><code class="id" id="m-id"></code></div>
      <button class="x" id="m-close">&times;</button>
    </header>
    <div class="body">
      <div class="row-btns">
        <button class="btn" id="m-run">Run</button>
        <button class="btn" id="m-cancel">Cancel</button>
        <button class="btn" id="m-edit">Edit</button>
        <button class="btn danger" id="m-delete">Delete</button>
      </div>
      <div class="err" id="m-err"></div>
      <div id="m-meta"></div>
      <label>Runs</label>
      <div class="runs" id="m-runs"></div>
      <label>Journal</label>
      <div class="journal" id="m-journal"></div>
      ${terminalBlock("Terminal")}
    </div>`);

  $("m-close").onclick = closeModal;
  $("m-run").onclick = () => act(`/api/tasks/${state.open}/run`);
  $("m-cancel").onclick = () => act(`/api/tasks/${state.open}/cancel`);
  $("m-edit").onclick = () => { const task = state.tasks.get(state.open); if (task) openEdit(task); };
  $("m-delete").onclick = () => act(`/api/tasks/${state.open}`, "DELETE");
  wireTerminal();

  await loadRuns();
  renderModal();
  await loadJournal();
  retimeTerminal();
}

/// A standing agent's own window: what its terminal shows, and a way to answer
/// it. This is what makes a trust dialog or a login something you can get past
/// without leaving the page.
async function openAgent(id) {
  closeModal();
  const found = findAgent(id);
  scrim(`
    <header>
      <div><h2>${esc(found ? found.agent.name : id)}</h2>
           <code class="id">${esc(id)}</code></div>
      <button class="x" id="a-close">&times;</button>
    </header>
    <div class="body">
      <div class="row-btns">
        <button class="btn" id="a-stop">Stop</button>
        <button class="btn" id="a-restart">Restart</button>
      </div>
      <div class="err" id="a-err"></div>
      ${found && found.agent.attach
        ? `<div class="attach"><span class="sub">attach</span><code>${esc(found.agent.attach)}</code></div>` : ""}
      ${terminalBlock("Terminal")}
    </div>`);
  $("a-close").onclick = closeModal;
  $("a-stop").onclick = async () => {
    try { await api("/api/agents/stop", { method: "POST", body: JSON.stringify({ id }) }); closeModal(); loadAgents(); }
    catch (e) { $("a-err").textContent = e.message; }
  };
  $("a-restart").onclick = async () => {
    if (!found) return;
    try {
      await api("/api/agents/stop", { method: "POST", body: JSON.stringify({ id }) });
      await api("/api/agents/start", { method: "POST", body: JSON.stringify({ scope: found.scope, name: found.agent.name }) });
      loadAgents();
      setTerminal("agent", id, true);
    } catch (e) { $("a-err").textContent = e.message; }
  };
  wireTerminal();
  setTerminal("agent", id, true);
}

function findAgent(id) {
  for (const s of state.scopes) {
    for (const a of s.agents) if (a.id === id) return { scope: s.name, agent: a };
  }
  return null;
}

async function act(path, method = "POST") {
  $("m-err").textContent = "";
  try { await api(path, { method }); }
  catch (e) { $("m-err").textContent = e.message; }
}

async function loadRuns() {
  try {
    state.runs = (await api(`/api/tasks/${state.open}/runs?limit=50`)).runs;
    if (!state.run || !state.runs.some(r => r.id === state.run)) {
      state.run = state.runs.length ? state.runs[0].id : null;
    }
  } catch { state.runs = []; }
}

function selectedRun() { return state.runs.find(r => r.id === state.run) || null; }

function renderModal() {
  const t = state.tasks.get(state.open);
  if (!t || !$("m-title")) return;
  $("m-title").innerHTML = `${esc(t.title)} ${statusBadge(t.status)}`;
  $("m-id").textContent = t.id;

  const active = state.runs.find(r => !TERMINAL.includes(r.status));
  $("m-run").disabled = !!active;
  $("m-cancel").disabled = !active;

  let meta = `<div class="sub">${esc(t.scope)} · ${esc(t.agent)} on ${esc(t.runtime)} · ${esc(scheduleLabel(t.schedule))}`;
  if (t.next_run_at) meta += ` · next ${new Date(t.next_run_at).toLocaleString()}`;
  if (t.ack_timeout_seconds) meta += ` · ack ${t.ack_timeout_seconds}s`;
  if (t.timeout_seconds) meta += ` · timeout ${t.timeout_seconds}s`;
  meta += `</div>`;
  const labels = Object.entries(t.labels || {});
  if (labels.length) {
    meta += `<div class="sub">${labels.map(([k, v]) => `<span class="tag">${esc(k)}=${esc(v)}</span>`).join(" ")}</div>`;
  }
  if (t.instructions) meta += `<label>Instructions</label><pre>${esc(t.instructions)}</pre>`;
  const r = selectedRun();
  if (r && r.result) meta += `<label>Result</label><pre>${esc(r.result)}</pre>`;
  if (r && r.error) meta += `<label>Error</label><pre>${esc(r.error)}</pre>`;
  $("m-meta").innerHTML = meta;

  $("m-runs").innerHTML = state.runs.length ? state.runs.map(r => {
    const secs = r.ended_at
      ? Math.round((new Date(r.ended_at) - new Date(r.started_at)) / 1000) + "s"
      : since(r.started_at);
    return `<button class="${r.id === state.run ? "on" : ""}" data-run="${esc(r.id)}">
      ${statusBadge(r.status)} attempt ${r.attempt}
      <span class="sub">${esc(r.trigger)} · ${new Date(r.started_at).toLocaleTimeString()} · ${secs}</span>
    </button>`;
  }).join("") : `<div class="sub">Not run yet.</div>`;

  for (const b of $("m-runs").querySelectorAll("button")) {
    b.onclick = () => { state.run = b.dataset.run; renderModal(); loadJournal(); retimeTerminal(); };
  }
}

async function loadJournal() {
  if (!$("m-journal")) return;
  const path = state.run
    ? `/api/runs/${state.run}/entries?limit=200`
    : `/api/tasks/${state.open}/entries?limit=200`;
  try {
    const entries = (await api(path)).entries;
    $("m-journal").innerHTML = entries.length
      ? entries.slice().reverse().map(e => `
        <div class="entry">
          <div class="when">${esc(new Date(e.at).toLocaleTimeString())} · <span class="who">${esc(e.source)}</span> · ${esc(e.kind)}</div>
          <div>${esc(e.message)}</div>
        </div>`).join("")
      : `<div class="entry sub">No entries yet.</div>`;
  } catch (e) {
    $("m-journal").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

// --------------------------------------------------------------- terminal
// Shown from the moment there is a session: live while it runs, the kept
// transcript afterwards. The daemon answers with empty text rather than an
// error in the seconds before a session is up, so this never flashes red.

function stopTerminal() {
  if (state.poll) { clearInterval(state.poll); state.poll = null; }
}

function setTerminal(kind, id, live) {
  stopTerminal();
  state.term = id ? { kind, id } : null;
  if ($("t-live")) $("t-live").hidden = !live;
  if ($("t-input")) $("t-input").disabled = !live;
  if (!state.term) {
    if ($("t-term")) { $("t-term").textContent = "No run yet. Press Run to start one."; $("t-term").classList.add("idle"); }
    return;
  }
  fetchTerminal();
  if (live) state.poll = setInterval(fetchTerminal, 1500);
}

function retimeTerminal() {
  const r = selectedRun();
  setTerminal("run", r ? r.id : null, r ? !TERMINAL.includes(r.status) : false);
}

async function fetchTerminal() {
  const el = $("t-term");
  const target = state.term;
  if (!el || !target) return;
  try {
    const data = target.kind === "run"
      ? await api(`/api/runs/${target.id}/output?lines=400`)
      : await api("/api/agents/output", { method: "POST", body: JSON.stringify({ id: target.id, lines: 400 }) });
    if (!state.term || state.term.id !== target.id || !$("t-term")) return;  // the view moved on
    const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
    if (data.text.trim()) {
      el.classList.remove("idle");
      el.textContent = data.text;
    } else {
      el.classList.add("idle");
      el.textContent = "Waiting for the session to come up…";
    }
    if (atBottom) el.scrollTop = el.scrollHeight;
  } catch (e) {
    el.classList.add("idle");
    el.textContent = e.message;
  }
}

async function sendInput(text, keys) {
  const target = state.term;
  if (!target) return;
  if ($("t-err")) $("t-err").textContent = "";
  try {
    const body = JSON.stringify(target.kind === "run"
      ? { text, keys }
      : { id: target.id, text, keys });
    await api(target.kind === "run" ? `/api/runs/${target.id}/input` : "/api/agents/input",
              { method: "POST", body });
    setTimeout(fetchTerminal, 250);
  } catch (e) {
    if ($("t-err")) $("t-err").textContent = e.message;
  }
}

// -------------------------------------------------------------- create task

function openCreate(prefill) {
  closeModal();
  prefill = prefill || {};
  scrim(`
    <header><div><h2>New task</h2></div><button class="x" id="c-close">&times;</button></header>
    <div class="body">
      ${taskFields(prefill)}
      <div class="err" id="c-err"></div>
      <div class="row-btns" style="margin-top:16px">
        <button class="btn primary" id="c-create">Create</button>
        <button class="btn" id="c-createrun">Create and run</button>
      </div>
    </div>`);
  $("c-close").onclick = closeModal;
  $("c-create").onclick = () => create(false);
  $("c-createrun").onclick = () => create(true);
  wireScopeAgent();
  $("c-title").focus();
}

/// Editing is the same fields, sent as a patch. A schedule set here has to be
/// rescheduled by the daemon, which is why this is a PATCH rather than a write
/// straight into the store.
function openEdit(task) {
  closeModal();
  scrim(`
    <header><div><h2>Edit task</h2><code class="id">${esc(task.id)}</code></div>
      <button class="x" id="c-close">&times;</button></header>
    <div class="body">
      ${taskFields({
        title: task.title,
        instructions: task.instructions,
        scope: task.scope,
        agent: task.agent,
        scheduleText: scheduleText(task.schedule),
        ack_timeout_seconds: task.ack_timeout_seconds,
        timeout_seconds: task.timeout_seconds,
        labelText: Object.entries(task.labels || {}).map(([k, v]) => `${k}=${v}`).join("\n"),
      })}
      <div class="err" id="c-err"></div>
      <div class="row-btns" style="margin-top:16px">
        <button class="btn primary" id="c-save">Save</button>
        <button class="btn" id="c-cancel">Cancel</button>
      </div>
    </div>`);
  $("c-close").onclick = closeModal;
  $("c-cancel").onclick = () => openTask(task.id);
  $("c-save").onclick = async () => {
    $("c-err").textContent = "";
    try {
      const f = readTaskFields();
      await api(`/api/tasks/${task.id}`, {
        method: "PATCH",
        body: JSON.stringify({
          ...f,
          // `null` means "leave alone" on the wire, so going back to the
          // instance default and dropping a schedule say so explicitly.
          clear_schedule: f.schedule === null,
          clear_ack_timeout: f.ack_timeout_seconds === null,
          clear_timeout: f.timeout_seconds === null,
        }),
      });
      openTask(task.id);
    } catch (e) { $("c-err").textContent = e.message; }
  };
  wireScopeAgent();
}

/// What a task in this scope can be given to: the agents the scope declares, by
/// name, and then any adapter that is not one of them. A scope's `assistant` and
/// its `scratch` are different agents even when both are pi -- naming the
/// harness would not tell them apart.
function agentOptions(scopeName, selected) {
  const scope = state.scopes.find(s => s.name === scopeName);
  const out = [`<option value="">(scope default)</option>`];
  const named = new Set();
  if (scope) {
    for (const a of scope.agents) {
      named.add(a.name);
      const hint = a.adapter !== a.name ? ` — ${a.adapter}` : "";
      const life = a.lifetime !== "task" ? ` (${a.lifetime})` : "";
      out.push(`<option value="${esc(a.name)}" ${a.name === selected ? "selected" : ""}>${esc(a.name)}${esc(hint)}${esc(life)}</option>`);
    }
  }
  const rest = state.adapters.filter(a => !named.has(a));
  if (rest.length) {
    out.push(`<optgroup label="any adapter">${rest.map(a =>
      `<option value="${esc(a)}" ${a === selected ? "selected" : ""}>${esc(a)}</option>`).join("")}</optgroup>`);
  }
  return out.join("");
}

function scopeOptions(selected) {
  return `<option value="">(first scope)</option>` + state.scopeNames.map(s =>
    `<option value="${esc(s)}" ${s === selected ? "selected" : ""}>${esc(s)}</option>`).join("");
}

/// The fields a task carries beyond its title. Shared by create and edit so the
/// two cannot drift into offering different things.
function taskFields(v) {
  v = v || {};
  return `
    <label for="c-title">Title</label>
    <input id="c-title" placeholder="What should happen" value="${esc(v.title || "")}">
    <label for="c-instructions">Instructions</label>
    <textarea id="c-instructions" placeholder="What the agent is being asked to do">${esc(v.instructions || "")}</textarea>
    <div class="grid2">
      <div><label for="c-scope">Scope</label>
        <select id="c-scope">${scopeOptions(v.scope)}</select></div>
      <div><label for="c-agent">Agent</label>
        <select id="c-agent">${agentOptions(v.scope || state.scopeNames[0], v.agent)}</select></div>
    </div>
    <label for="c-schedule">Schedule <span class="sub" style="text-transform:none">(blank = manual)</span></label>
    <input id="c-schedule" placeholder="every 5m  ·  0 9 * * 1-5" value="${esc(v.scheduleText || "")}">
    <div class="grid2">
      <div><label for="c-ack">Acknowledge within <span class="sub" style="text-transform:none">seconds</span></label>
        <input id="c-ack" type="number" min="1" placeholder="instance default" value="${v.ack_timeout_seconds ?? ""}"></div>
      <div><label for="c-timeout">Run timeout <span class="sub" style="text-transform:none">seconds</span></label>
        <input id="c-timeout" type="number" min="1" placeholder="instance default" value="${v.timeout_seconds ?? ""}"></div>
    </div>
    <label for="c-labels">Labels <span class="sub" style="text-transform:none">key=value, one per line</span></label>
    <textarea id="c-labels" style="min-height:52px" placeholder="area=infra">${esc(v.labelText || "")}</textarea>`;
}

/// Changing the scope changes which agents exist, so the second select is
/// rebuilt rather than left showing an agent the new scope has never heard of.
function wireScopeAgent() {
  const scope = $("c-scope");
  if (!scope) return;
  scope.onchange = () => {
    $("c-agent").innerHTML = agentOptions(scope.value || state.scopeNames[0], null);
  };
}

function readTaskFields() {
  const labels = {};
  for (const line of $("c-labels").value.split("\n")) {
    const s = line.trim();
    if (!s) continue;
    const i = s.indexOf("=");
    if (i < 1) throw new Error(`labels look like key=value, not "${s}"`);
    labels[s.slice(0, i).trim()] = s.slice(i + 1).trim();
  }
  const num = (id) => {
    const v = $(id).value.trim();
    return v ? parseInt(v, 10) : null;
  };
  return {
    title: $("c-title").value.trim(),
    instructions: $("c-instructions").value,
    scope: $("c-scope").value || null,
    agent: $("c-agent").value || null,
    schedule: parseSchedule($("c-schedule").value),
    ack_timeout_seconds: num("c-ack"),
    timeout_seconds: num("c-timeout"),
    labels,
  };
}

function scheduleText(s) {
  if (!s) return "";
  if (s.cron) return s.cron;
  if (s.every) return `every ${s.every.seconds}s`;
  return "";
}

function parseSchedule(text) {
  const v = text.trim();
  if (!v) return null;
  const m = v.match(/^every\s+(\d+)\s*(s|sec|secs|seconds|m|min|mins|minutes|h|hrs?|hours?)?$/i);
  if (m) {
    const n = parseInt(m[1], 10);
    const u = (m[2] || "s").toLowerCase();
    const mult = u.startsWith("h") ? 3600 : (u.startsWith("m") ? 60 : 1);
    return { every: { seconds: n * mult } };
  }
  return { cron: v.replace(/^cron\s+/i, "") };
}

async function create(andRun) {
  $("c-err").textContent = "";
  try {
    const data = await api("/api/tasks", {
      method: "POST",
      body: JSON.stringify(readTaskFields()),
    });
    const task = data.task;
    state.tasks.set(task.id, task);
    renderTasks();
    if (andRun) await api(`/api/tasks/${task.id}/run`, { method: "POST" });
    openTask(task.id);
  } catch (e) {
    $("c-err").textContent = e.message;
  }
}

// ---------------------------------------------------------------------- tabs

function showTab(name) {
  state.tab = name;
  $("view-tasks").hidden = name !== "tasks";
  $("view-agents").hidden = name !== "agents";
  $("tab-tasks").classList.toggle("on", name === "tasks");
  $("tab-agents").classList.toggle("on", name === "agents");
  if (state.agentPoll) { clearInterval(state.agentPoll); state.agentPoll = null; }
  if (name === "agents") {
    loadAgents();
    // Elapsed times tick even when nothing happens.
    state.agentPoll = setInterval(renderAgents, 5000);
  }
}

// ---------------------------------------------------------------------- boot

async function boot() {
  try {
    const info = (await api("/api/status")).status;
    $("instance").textContent = `${info.instance} · ${info.root}`;
    state.scopeNames = info.scopes || [];
  } catch (e) { $("instance").textContent = e.message; }

  try {
    state.scopes = (await api("/api/agents")).scopes;
    if (state.scopes.length) state.adapters = state.scopes[0].available;
  } catch { state.scopes = []; }

  try {
    const tasks = (await api("/api/tasks")).tasks;
    state.tasks = new Map(tasks.map(t => [t.id, t]));
    renderTasks();
  } catch { /* the websocket snapshot will fill it in */ }

  $("tab-tasks").onclick = () => showTab("tasks");
  $("tab-agents").onclick = () => showTab("agents");
  $("newTask").onclick = () => openCreate();

  connect();
}

boot();
</script>
</body>
