<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The type is IBM Plex. A machine with no internet falls back to the stack
     in app.css and the page is still readable, just not condensed. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/ui/app.css">
<script>
  // Before the first paint, and not in a module: a module is deferred, and a
  // page that renders dark then flips to light has already been seen doing it.
  try {
    var saved = localStorage.getItem("factory-theme");
  } catch (e) { }
  document.documentElement.dataset.theme =
    saved === "foundry-light" ? "foundry-light" : "foundry-dark";
</script>
</head>
<body>
<header>
  <h1>Factory</h1>
  <span class="meta" id="instance">—</span>
  <nav class="tabs">
    <button id="tab-tasks" class="on">Tasks</button>
    <button id="tab-agents">Agents</button>
  </nav>
  <span class="meta" style="margin-left:auto"><span class="dot" id="dot"></span><span id="conn">connecting</span></span>
  <button class="theme-switch" id="theme" title="switch theme">foundry dark</button>
</header>

<main>
  <div id="view-tasks">
    <div class="bar">
      <h2>Tasks</h2>
      <span class="sp"></span>
      <button class="btn primary" id="newTask">New task</button>
    </div>
    <section>
      <table>
        <thead><tr><th style="width:42%">Task</th><th>Status</th><th>Runs</th><th>Scope</th><th>Agent</th></tr></thead>
        <tbody id="tasks"></tbody>
      </table>
      <div class="empty" id="noTasks" hidden>Nothing here yet.</div>
    </section>
  </div>

  <div id="view-agents" hidden>
    <div class="bar">
      <h2>Agents</h2>
      <span class="sp"></span>
      <select id="occ-window" title="how far back the chart looks">
        <option value="60">last hour</option>
        <option value="360">last 6 hours</option>
        <option value="720" selected>last 12 hours</option>
        <option value="1440">last 24 hours</option>
        <option value="10080">last 7 days</option>
      </select>
      <div class="seg" id="agent-view">
        <button data-view="occupancy" class="on">Occupancy</button>
        <button data-view="roster">Roster</button>
      </div>
    </div>
    <section id="view-occupancy"><div class="occ" id="occ" style="--lab:186px">loading…</div></section>
    <div class="agents" id="agents" hidden></div>
  </div>
</main>

<script type="module" src="/ui/js/app.js"></script>
</body>
</html>
