<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #fff; --line: #e6e2dc; --ink: #1c1b19;
    --dim: #6d6862; --accent: #9a3f1f; --ok: #2f6b3a; --bad: #a32626;
    --warn: #8a6d1f; --code: #f2efea; --shadow: 0 12px 40px rgba(28,27,25,.18);
    --term-bg: #1c1b19; --term-ink: #e8e3da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614; --panel: #201e1b; --line: #35312c; --ink: #ece8e1;
      --dim: #9a948b; --accent: #e08256; --ok: #7cc088; --bad: #e28080;
      --warn: #d6b55c; --code: #2a2723; --shadow: 0 12px 40px rgba(0,0,0,.5);
      --term-bg: #121110; --term-ink: #ddd7cd;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { margin: 0; font-size: 17px; letter-spacing: .02em; }
  .meta { color: var(--dim); font-size: 13px; }
  .tabs { display: flex; gap: 4px; }
  .tabs button {
    border: 1px solid transparent; background: none; color: var(--dim);
    padding: 5px 13px; border-radius: 7px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button.on { background: var(--code); color: var(--ink); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 6px; }
  .dot.live { background: var(--ok); }
  main { padding: 20px 24px 60px; max-width: 1180px; margin: 0 auto; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .bar h2 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 600; }
  .bar .sp { margin-left: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  tr:last-child td { border-bottom: 0; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: var(--code); }
  .title { font-weight: 500; }
  .sub { color: var(--dim); font-size: 12px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11.5px;
    font-weight: 600; text-transform: uppercase; letter-spacing: .04em; border: 1px solid var(--line); white-space: nowrap; }
  .s-pending { color: var(--dim); }
  .s-dispatching, .s-running { color: var(--warn); border-color: var(--warn); }
  .s-blocked { color: var(--accent); border-color: var(--accent); }
  .s-done { color: var(--ok); border-color: var(--ok); }
  .s-failed, .s-cancelled { color: var(--bad); border-color: var(--bad); }
  label { display: block; font-size: 12px; color: var(--dim); margin: 12px 0 4px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .05em; }
  input, textarea, select {
    font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%;
  }
  textarea { min-height: 84px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  button.btn {
    font: inherit; color: inherit; background: var(--panel); cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 13px;
  }
  button.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.btn:disabled { opacity: .4; cursor: default; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.primary:hover:not(:disabled) { opacity: .9; color: #fff; }
  button.btn.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  pre { background: var(--code); padding: 10px 12px; border-radius: 6px; overflow-x: auto;
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; white-space: pre-wrap; }
  .empty { color: var(--dim); padding: 22px 16px; font-style: italic; }
  .err { color: var(--bad); font-size: 13px; margin-top: 8px; }
  code.id { font: 12px ui-monospace, Menlo, monospace; color: var(--dim); }

  /* agents */
  .agents { display: grid; gap: 14px; }
  .agent { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .agent h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim);
    border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; font-weight: 600; }
  .tag.plug { color: var(--accent); border-color: var(--accent); }
  .work { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 8px; }
  .work .job { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; cursor: pointer; }
  .work .job:hover .jt { color: var(--accent); }
  .jt { font-weight: 500; }
  .idle { color: var(--dim); font-size: 13px; font-style: italic; margin-top: 10px; }

  /* modal */
  .scrim { position: fixed; inset: 0; background: rgba(20,19,17,.5); z-index: 20;
    display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); width: min(900px, 100%); }
  .modal > header { position: static; border-radius: 12px 12px 0 0; align-items: flex-start; }
  .modal h2 { margin: 0 0 2px; font-size: 17px; }
  .x { margin-left: auto; background: none; border: 0; color: var(--dim); font-size: 22px;
    line-height: 1; cursor: pointer; padding: 0 4px; }
  .x:hover { color: var(--ink); }
  .modal .body { padding: 16px 24px 24px; }
  .runs { display: flex; gap: 8px; flex-wrap: wrap; }
  .runs button {
    font: inherit; cursor: pointer; background: var(--bg); color: inherit;
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px; text-align: left; font-size: 13px;
  }
  .runs button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .runs button .sub { display: block; }
  .journal { max-height: 220px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; padding: 0 12px; }
  .entry { border-bottom: 1px solid var(--line); padding: 8px 0; font-size: 13px; }
  .entry:last-child { border-bottom: 0; }
  .entry .when { color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .entry .who { font-weight: 600; }
  .term {
    background: var(--term-bg); color: var(--term-ink); border-radius: 6px; padding: 12px 14px;
    font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    height: 300px; overflow: auto; white-space: pre; margin: 0;
  }
  .term.idle { color: #8b857b; font-style: italic; white-space: pre-wrap; }
  .live-tag { color: var(--warn); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
</style>
</head>
<body>
<header>
  <h1>Factory</h1>
  <span class="meta" id="instance">—</span>
  <nav class="tabs">
    <button id="tab-tasks" class="on">Tasks</button>
    <button id="tab-agents">Agents</button>
  </nav>
  <span class="meta" style="margin-left:auto"><span class="dot" id="dot"></span><span id="conn">connecting</span></span>
</header>

<main>
  <div id="view-tasks">
    <div class="bar">
      <h2>Tasks</h2>
      <span class="sp"></span>
      <button class="btn primary" id="newTask">New task</button>
    </div>
    <section>
      <table>
        <thead><tr><th style="width:42%">Task</th><th>Status</th><th>Runs</th><th>Scope</th><th>Agent</th></tr></thead>
        <tbody id="tasks"></tbody>
      </table>
      <div class="empty" id="noTasks" hidden>Nothing here yet.</div>
    </section>
  </div>

  <div id="view-agents" hidden>
    <div class="bar"><h2>Agents</h2></div>
    <div class="agents" id="agents"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TERMINAL = ["done", "failed", "cancelled"];

const state = {
  tab: "tasks",
  tasks: new Map(),
  agents: [],
  open: null,          // task id shown in the modal
  runs: [],            // runs of the open task
  run: null,           // selected run id
  poll: null,          // terminal poll timer
  agentPoll: null,
};

// ---------------------------------------------------------------- transport

async function api(path, opts) {
  const res = await fetch(path, { headers: { "content-type": "application/json" }, ...opts });
  const body = await res.json().catch(() => null);
  if (!body) throw new Error(`${res.status} ${res.statusText}`);
  if (body.status === "error") throw new Error(body.message);
  return body.data;
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onopen = () => { $("dot").classList.add("live"); $("conn").textContent = "live"; };
  ws.onclose = () => {
    $("dot").classList.remove("live"); $("conn").textContent = "reconnecting";
    setTimeout(connect, 1500);
  };
  ws.onmessage = (m) => {
    let msg; try { msg = JSON.parse(m.data); } catch { return; }
    if (msg.status !== "ok") return;
    const d = msg.data;
    if (d.kind === "tasks") {
      state.tasks = new Map(d.tasks.map(t => [t.id, t]));
      renderTasks();
    } else if (d.kind === "event") {
      onEvent(d.event);
    }
  };
}

function onEvent(ev) {
  switch (ev.type) {
    case "task_created":
    case "task_updated":
      state.tasks.set(ev.task.id, ev.task);
      renderTasks();
      if (state.open === ev.task.id) renderModal();
      break;
    case "task_deleted":
      state.tasks.delete(ev.id);
      renderTasks();
      if (state.open === ev.id) closeModal();
      break;
    case "task_entry":
      if (state.open === ev.id) loadJournal();
      break;
    case "run_started":
    case "run_updated":
      if (state.open === ev.run.task_id) {
        const i = state.runs.findIndex(r => r.id === ev.run.id);
        if (i >= 0) state.runs[i] = ev.run; else state.runs.unshift(ev.run);
        // A new run is the one worth watching.
        if (ev.type === "run_started") state.run = ev.run.id;
        renderModal();
        retimeTerminal();
      }
      break;
  }
  // The agents page is a view over runs; any run change moves it.
  if (state.tab === "agents" && ev.type.startsWith("run_")) loadAgents();
}

// ------------------------------------------------------------------- tasks

function statusBadge(s) { return `<span class="badge s-${esc(s)}">${esc(s)}</span>`; }

function scheduleLabel(s) {
  if (!s) return "manual";
  if (s.cron) return `cron ${s.cron}`;
  if (s.every) return `every ${s.every.seconds}s`;
  return "scheduled";
}

function renderTasks() {
  const rows = [...state.tasks.values()].sort((a, b) => b.created_at.localeCompare(a.created_at));
  $("noTasks").hidden = rows.length > 0;
  $("tasks").innerHTML = rows.map(t => `
    <tr class="row" data-id="${esc(t.id)}">
      <td><div class="title">${esc(t.title)}</div>
          <div class="sub">${esc(scheduleLabel(t.schedule))}</div></td>
      <td>${statusBadge(t.status)}</td>
      <td class="sub">${t.runs || 0}</td>
      <td class="sub">${esc(t.scope)}</td>
      <td class="sub">${esc(t.agent)}</td>
    </tr>`).join("");
  for (const tr of $("tasks").querySelectorAll("tr.row")) {
    tr.onclick = () => openTask(tr.dataset.id);
  }
}

// ------------------------------------------------------------------ agents

async function loadAgents() {
  try {
    state.agents = (await api("/api/agents")).agents;
    renderAgents();
  } catch (e) {
    $("agents").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

function since(iso) {
  const secs = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  if (secs < 90) return `${secs}s`;
  if (secs < 5400) return `${Math.round(secs / 60)}m`;
  return `${Math.round(secs / 3600)}h`;
}

function renderAgents() {
  $("agents").innerHTML = state.agents.map(a => {
    const tags = [];
    if (a.source !== "builtin") tags.push(`<span class="tag plug">plugin</span>`);
    if (a.instance_default) tags.push(`<span class="tag">instance default</span>`);
    for (const s of a.default_for) tags.push(`<span class="tag">${esc(s)}</span>`);
    const work = a.active.length ? `
      <div class="work">${a.active.map(w => `
        <div class="job" data-task="${esc(w.task_id)}" data-run="${esc(w.run_id)}">
          ${statusBadge(w.status)}
          <span class="jt">${esc(w.task_title)}</span>
          <span class="sub">attempt ${w.attempt} · ${esc(w.trigger)} · ${esc(w.scope)} · ${esc(w.runtime)}${w.session ? " " + esc(w.session) : ""} · ${since(w.started_at)}</span>
        </div>`).join("")}</div>`
      : `<div class="idle">idle — nothing running</div>`;
    return `<div class="agent">
      <h3>${esc(a.name)} ${tags.join(" ")}</h3>
      <div class="sub">${esc(a.description)}</div>
      ${work}
    </div>`;
  }).join("") || `<div class="empty">No agent adapters registered.</div>`;

  for (const job of $("agents").querySelectorAll(".job")) {
    job.onclick = () => openTask(job.dataset.task, job.dataset.run);
  }
}

// ------------------------------------------------------------------- modal

function scrim(inner) {
  const el = document.createElement("div");
  el.className = "scrim";
  el.innerHTML = `<div class="modal">${inner}</div>`;
  el.onclick = (e) => { if (e.target === el) closeModal(); };
  document.body.appendChild(el);
  return el;
}

function closeModal() {
  for (const el of document.querySelectorAll(".scrim")) el.remove();
  state.open = null; state.runs = []; state.run = null;
  stopTerminal();
}

document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

async function openTask(id, runId) {
  closeModal();
  state.open = id;
  state.run = runId || null;
  scrim(`
    <header>
      <div><h2 id="m-title">…</h2><code class="id" id="m-id"></code></div>
      <button class="x" id="m-close">&times;</button>
    </header>
    <div class="body">
      <div class="row-btns">
        <button class="btn" id="m-run">Run</button>
        <button class="btn" id="m-cancel">Cancel</button>
        <button class="btn danger" id="m-delete">Delete</button>
        <span class="sp"></span>
      </div>
      <div class="err" id="m-err"></div>
      <div id="m-meta"></div>
      <label>Runs</label>
      <div class="runs" id="m-runs"></div>
      <label>Journal</label>
      <div class="journal" id="m-journal"></div>
      <label>Terminal <span class="live-tag" id="m-live" hidden>live</span></label>
      <pre class="term" id="m-term">connecting…</pre>
    </div>`);

  $("m-close").onclick = closeModal;
  $("m-run").onclick = () => act(`/api/tasks/${state.open}/run`);
  $("m-cancel").onclick = () => act(`/api/tasks/${state.open}/cancel`);
  $("m-delete").onclick = () => act(`/api/tasks/${state.open}`, "DELETE");

  await loadRuns();
  renderModal();
  await loadJournal();
  retimeTerminal();
}

async function act(path, method = "POST") {
  $("m-err").textContent = "";
  try { await api(path, { method }); }
  catch (e) { $("m-err").textContent = e.message; }
}

async function loadRuns() {
  try {
    state.runs = (await api(`/api/tasks/${state.open}/runs?limit=50`)).runs;
    if (!state.run || !state.runs.some(r => r.id === state.run)) {
      state.run = state.runs.length ? state.runs[0].id : null;
    }
  } catch { state.runs = []; }
}

function selectedRun() { return state.runs.find(r => r.id === state.run) || null; }

function renderModal() {
  const t = state.tasks.get(state.open);
  if (!t || !$("m-title")) return;
  $("m-title").innerHTML = `${esc(t.title)} ${statusBadge(t.status)}`;
  $("m-id").textContent = t.id;

  const active = state.runs.find(r => !TERMINAL.includes(r.status));
  $("m-run").disabled = !!active;
  $("m-cancel").disabled = !active;

  let meta = `<div class="sub">${esc(t.scope)} · ${esc(t.agent)} on ${esc(t.runtime)} · ${esc(scheduleLabel(t.schedule))}`;
  if (t.next_run_at) meta += ` · next ${new Date(t.next_run_at).toLocaleString()}`;
  meta += `</div>`;
  if (t.instructions) meta += `<label>Instructions</label><pre>${esc(t.instructions)}</pre>`;
  const r = selectedRun();
  if (r && r.result) meta += `<label>Result</label><pre>${esc(r.result)}</pre>`;
  if (r && r.error) meta += `<label>Error</label><pre>${esc(r.error)}</pre>`;
  $("m-meta").innerHTML = meta;

  $("m-runs").innerHTML = state.runs.length ? state.runs.map(r => {
    const secs = r.ended_at
      ? Math.round((new Date(r.ended_at) - new Date(r.started_at)) / 1000) + "s"
      : since(r.started_at);
    return `<button class="${r.id === state.run ? "on" : ""}" data-run="${esc(r.id)}">
      ${statusBadge(r.status)} attempt ${r.attempt}
      <span class="sub">${esc(r.trigger)} · ${new Date(r.started_at).toLocaleTimeString()} · ${secs}</span>
    </button>`;
  }).join("") : `<div class="sub">Not run yet.</div>`;

  for (const b of $("m-runs").querySelectorAll("button")) {
    b.onclick = () => { state.run = b.dataset.run; renderModal(); loadJournal(); retimeTerminal(); };
  }
}

async function loadJournal() {
  if (!$("m-journal")) return;
  const path = state.run
    ? `/api/runs/${state.run}/entries?limit=200`
    : `/api/tasks/${state.open}/entries?limit=200`;
  try {
    const entries = (await api(path)).entries;
    $("m-journal").innerHTML = entries.length
      ? entries.slice().reverse().map(e => `
        <div class="entry">
          <div class="when">${esc(new Date(e.at).toLocaleTimeString())} · <span class="who">${esc(e.source)}</span> · ${esc(e.kind)}</div>
          <div>${esc(e.message)}</div>
        </div>`).join("")
      : `<div class="entry sub">No entries yet.</div>`;
  } catch (e) {
    $("m-journal").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

// --------------------------------------------------------------- terminal
// Shown from the moment a run exists: live from its session while it runs, its
// kept transcript afterwards. The daemon answers with empty text rather than an
// error in the seconds before a session is up, so this never flashes red.

function stopTerminal() {
  if (state.poll) { clearInterval(state.poll); state.poll = null; }
}

function retimeTerminal() {
  stopTerminal();
  const r = selectedRun();
  if (!r) {
    if ($("m-term")) { $("m-term").textContent = "No run yet. Press Run to start one."; $("m-term").classList.add("idle"); }
    if ($("m-live")) $("m-live").hidden = true;
    return;
  }
  const live = !TERMINAL.includes(r.status);
  if ($("m-live")) $("m-live").hidden = !live;
  fetchTerminal();
  if (live) state.poll = setInterval(fetchTerminal, 1500);
}

async function fetchTerminal() {
  const el = $("m-term");
  const runId = state.run;
  if (!el || !runId) return;
  try {
    const text = (await api(`/api/runs/${runId}/output?lines=400`)).text;
    if (state.run !== runId || !$("m-term")) return;   // the view moved on
    // Only follow the tail if the reader is already at it.
    const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
    if (text.trim()) {
      el.classList.remove("idle");
      el.textContent = text;
    } else {
      el.classList.add("idle");
      el.textContent = "Waiting for the session to come up…";
    }
    if (atBottom) el.scrollTop = el.scrollHeight;
  } catch (e) {
    el.classList.add("idle");
    el.textContent = e.message;
  }
}

// -------------------------------------------------------------- create task

function openCreate() {
  closeModal();
  const scopes = (state.scopes || []);
  scrim(`
    <header><div><h2>New task</h2></div><button class="x" id="c-close">&times;</button></header>
    <div class="body">
      <label for="c-title">Title</label>
      <input id="c-title" placeholder="What should happen">
      <label for="c-instructions">Instructions</label>
      <textarea id="c-instructions" placeholder="What the agent is being asked to do"></textarea>
      <div class="grid2">
        <div><label for="c-scope">Scope</label>
          <select id="c-scope"><option value="">(first scope)</option>${
            scopes.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("")}</select></div>
        <div><label for="c-agent">Agent</label>
          <select id="c-agent"><option value="">(scope default)</option>${
            state.agents.map(a => `<option value="${esc(a.name)}">${esc(a.name)}</option>`).join("")}</select></div>
      </div>
      <label for="c-schedule">Schedule <span class="sub" style="text-transform:none">(blank = manual)</span></label>
      <input id="c-schedule" placeholder="every 5m  ·  0 9 * * 1-5">
      <div class="err" id="c-err"></div>
      <div class="row-btns" style="margin-top:16px">
        <button class="btn primary" id="c-create">Create</button>
        <button class="btn" id="c-createrun">Create and run</button>
      </div>
    </div>`);
  $("c-close").onclick = closeModal;
  $("c-create").onclick = () => create(false);
  $("c-createrun").onclick = () => create(true);
  $("c-title").focus();
}

function parseSchedule(text) {
  const v = text.trim();
  if (!v) return null;
  const m = v.match(/^every\s+(\d+)\s*(s|sec|secs|seconds|m|min|mins|minutes|h|hrs?|hours?)?$/i);
  if (m) {
    const n = parseInt(m[1], 10);
    const u = (m[2] || "s").toLowerCase();
    const mult = u.startsWith("h") ? 3600 : (u.startsWith("m") ? 60 : 1);
    return { every: { seconds: n * mult } };
  }
  return { cron: v.replace(/^cron\s+/i, "") };
}

async function create(andRun) {
  $("c-err").textContent = "";
  try {
    const data = await api("/api/tasks", {
      method: "POST",
      body: JSON.stringify({
        title: $("c-title").value.trim(),
        instructions: $("c-instructions").value,
        scope: $("c-scope").value || null,
        agent: $("c-agent").value || null,
        schedule: parseSchedule($("c-schedule").value),
      }),
    });
    const task = data.task;
    state.tasks.set(task.id, task);
    renderTasks();
    if (andRun) await api(`/api/tasks/${task.id}/run`, { method: "POST" });
    openTask(task.id);
  } catch (e) {
    $("c-err").textContent = e.message;
  }
}

// ---------------------------------------------------------------------- tabs

function showTab(name) {
  state.tab = name;
  $("view-tasks").hidden = name !== "tasks";
  $("view-agents").hidden = name !== "agents";
  $("tab-tasks").classList.toggle("on", name === "tasks");
  $("tab-agents").classList.toggle("on", name === "agents");
  if (state.agentPoll) { clearInterval(state.agentPoll); state.agentPoll = null; }
  if (name === "agents") {
    loadAgents();
    // Elapsed times tick even when nothing happens.
    state.agentPoll = setInterval(renderAgents, 5000);
  }
}

// ---------------------------------------------------------------------- boot

async function boot() {
  try {
    const info = (await api("/api/status")).status;
    $("instance").textContent = `${info.instance} · ${info.root}`;
    state.scopes = info.scopes || [];
  } catch (e) { $("instance").textContent = e.message; }

  try { state.agents = (await api("/api/agents")).agents; } catch { state.agents = []; }

  try {
    const tasks = (await api("/api/tasks")).tasks;
    state.tasks = new Map(tasks.map(t => [t.id, t]));
    renderTasks();
  } catch { /* the websocket snapshot will fill it in */ }

  $("tab-tasks").onclick = () => showTab("tasks");
  $("tab-agents").onclick = () => showTab("agents");
  $("newTask").onclick = openCreate;

  connect();
}

boot();
</script>
</body>
